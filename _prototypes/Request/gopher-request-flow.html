<!DOCTYPE html>
<!--
==============================================================================
  GOPHER REQUEST — flow reskin prototype (standalone 7-step request wizard)
------------------------------------------------------------------------------
  CHANGELOG (newest first)
  v111 2026-06-16  Screenshot-driven prototype updates (items 3-5).
                   • Item 3: the Step-2 TrustShield banners now render the REAL TrustShield
                     seal (hoisted module-level TS_SEAL_URI + tsSeal(px) helper) instead of
                     the generic monoline shield glyph — swapped in the ts-verified banner
                     (seal @18px) and the ts-promo CTA (seal @20px). The non-TrustShield
                     "Identity verified" banner + rr-lock hint deliberately keep svgIco('shield').
                   • Item 4: fixed the cost-info popover clipping off the right edge of the
                     390px phone frame. Added max-width:calc(100vw - 24px) to .info-popover and
                     a JS clampOpenPopover() (rAF after the info toggle + on resize) that nudges
                     any open popover back inside the frame with a 10px pad. The nudge is applied
                     via `left` (NOT transform): the open popover runs `animation:stageIn ... both`
                     whose final keyframe is `transform:none`, and CSS animations outrank inline
                     styles, so a transform nudge was silently overridden. Verified geometrically
                     in a headless browser (Playwright/Chromium) — popovers across steps 2-6 all
                     sit inside the frame.
                   • Item 5: the review "Payment to workers" row + its info-button aria-label now
                     read singular/plural off wCount ("Payment to your worker" vs "...workers";
                     "...your worker breakdown" vs "...workers breakdown").
                   Verified: single JS block / 0 errors.
==============================================================================
-->
<html lang="en">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Gopher Request — New Request</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@600;700;800;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Gopher Banner Notification template (Jira G40-306): branded push banners.
     Request banners carry the full Gopher character. docs/handoff/G40-306-banner-notifications.html -->
<script src="gopher-banner.js"></script>
<!-- Age-restricted keyword brain — generated from Documentation/Dashboard/Gopher iQ Keywords/Age-Restricted Key Words/*.xlsx (canonical source). -->
<script src="../../assets/js/gopher-age-keywords.js"></script>
<script src="../../assets/js/gopher-age-supplement.js"></script>
<!-- iQ service-category intent classifier (shared, generated) — for the category-
     mismatch nudge. Same brain the Final Request/Connect web apps use. -->
<script src="../../assets/js/gopher-category-classifier.js"></script>
<!-- Shared request decision logic (category-mismatch detection). Single source of
     truth across Request web / Connect / this app prototype. -->
<script src="../../assets/js/gopher-request-logic.js"></script>
<!-- Cross-device draft layer. Shared with Final/gopher-request.html so the two
     surfaces cannot drift on WHAT a draft contains. ⚠️ Keep the ../../Final/ prefix:
     scripts/deploy.sh rewrites it to ../../ when it flattens Final/ to the site root,
     and the local serve + tunnel need the repo-layout form. Do NOT "fix" it here. -->
<script src="../../assets/js/gopher-request-draft.js"></script>
<script src="../../assets/js/gopher-request-draft-store.js"></script>
<!-- G40-38 payment methods — shared store + checkout pay-picker (same session store as the account Payment Info screen). -->
<script src="gopher-pay-store.js"></script>
<style>
:root{ --radius-pill:99px; --radius-card:16px; --radius-md:12px; --radius-sm:8px; --font-heading:'Nunito'; --font-body:'DM Sans'; --font-script:'Caveat';  --z-deals:#F3F5F8; --z-jobs:#EEF7F1; --z-tools:#EDF1F8; --z-acct:#E9F1FC; --z-perks:#FBF1E8;  --green-tint:#E8F5EE; --ink:#002461; --ink-soft:#3A4D74; --navy-bar:#03143A; --paper:#FBF7EF; --card:#FFFFFF; --line:#EAE3D5; --line-cool:#E3E7EF; --terra:#C8623C; 
  --green:#1CB061; --green-bright:#33D975; --green-dark:#1CB061; --green-light:#e2f3e9;
  --ink-on-green:#002461; --navy:#002461; --navy-mid:#1a3a7a; --navy-light:#eef0f8;
  --white:#fff; --sand:#FBF3E4; --gray:#f5f6fa; --text:#424242; --muted:#8C8675; --muted-cool:#6b7280;
  --terracotta:#D97757; --aqua:#87F7BD; --cornflower:#BADBFC;
  --warning:#FFDE00; --warning-text:#92580D; --error:#C44257;
  --border:#edf0f5;
  --radius:18px;
  --card-sh:0 2px 4px rgba(0,36,97,.05),0 9px 20px rgba(0,36,97,.13);
  --elig-sh:0 2px 4px rgba(28,176,97,.08),0 10px 22px rgba(28,176,97,.22);
  --raise-sh:0 6px 24px rgba(0,36,97,.10);
  --over-sh:0 18px 48px rgba(0,36,97,.22);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
/* Form controls do NOT inherit font — the UA stylesheet pins them to Arial 13.3333px.
   Measured 2026-08-02 across all 44 rendered screens: every element painting a non-brand
   font was a form control or a descendant of one. One rule fixes all of them; 36 per-
   component selectors would miss the next new button. font-weight deliberately NOT reset
   — buttons that look bold declare their own, and `font:inherit` would flatten them. */
button,input,select,textarea{font-family:inherit;font-size:inherit;}

html,body{height:100%;}
body{
  font-family:'DM Sans',sans-serif;color:var(--text);line-height:1.5;
  background:#d7deea;
  background-image:radial-gradient(circle at 20% 10%,#e4eaf4,transparent 40%),radial-gradient(circle at 85% 90%,#dbe7df,transparent 45%);
  display:flex;align-items:center;justify-content:center;padding:20px;min-height:100vh;
}

/* ── Phone frame (Gopher Go convention: 390px, r26, soft navy shadow) ── */
.phone{
  width:390px;max-width:100%;height:844px;max-height:calc(100vh - 40px);
  background:#eef2f7;border-radius:42px;overflow:hidden;overflow:clip;position:relative;
  box-shadow:0 30px 80px -20px rgba(0,36,97,.45),0 0 0 11px #0a1730,0 0 0 13px #1f2c44;
  display:flex;flex-direction:column;
}
@media(max-width:430px){ body{padding:14px;} }

/* faux status bar */
.statusbar{height:30px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;font-family:'Nunito';font-weight:800;font-size:12.5px;color:var(--navy);background:#fff;}
.statusbar .sb-r{display:flex;align-items:center;gap:6px;}
.statusbar svg{display:block;}

/* top app bar */
.topbar{flex:0 0 auto;background:#fff;display:flex;align-items:center;gap:11px;padding:10px 14px 12px;border-bottom:1px solid var(--border);}
.back-btn{width:38px;height:38px;border-radius:11px;border:1.5px solid #e4e8f0;background:#fff;color:var(--navy);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;transition:background .15s,transform .1s;}
.back-btn:hover{background:var(--navy-light);} .back-btn:active{transform:scale(.94);}
.back-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
.back-btn.hidden{visibility:hidden;}
.topbar-titles{flex:1;min-width:0;}
.topbar-titles h1{font-family:'Nunito';font-weight:900;font-size:16.5px;color:var(--navy);letter-spacing:-.3px;line-height:1.1;}
.topbar-titles .eyebrow{font-family:'Caveat';font-weight:700;font-size:15px;color:var(--green);line-height:1;margin-bottom:1px;}
.step-pill{font-family:'Nunito';font-weight:800;font-size:11px;color:var(--green);background:var(--green-light);
  padding:6px 11px;border-radius:99px;flex:0 0 auto;white-space:nowrap;}

/* progress segments (tappable to jump back) */
.progress{flex:0 0 auto;display:flex;gap:4px;padding:5px 16px 7px;background:#fff;border-bottom:1px solid var(--border);}
.seg-btn{flex:1;padding:7px 0;background:none;border:0;display:block;cursor:default;-webkit-tap-highlight-color:transparent;}
.seg-btn.reach{cursor:pointer;}
.seg-btn.reach:active .seg{transform:scaleY(1.8);}
.seg{display:block;height:5px;border-radius:99px;background:#e7ecf3;overflow:hidden;position:relative;transition:transform .12s;}
.seg.done{background:var(--green);}
.seg.current{background:#e7ecf3;}
.seg.current::after{content:"";position:absolute;inset:0;width:55%;background:linear-gradient(90deg,var(--green-bright),var(--green));border-radius:99px;animation:segfill .5s ease both;}
@keyframes segfill{from{width:0;}to{width:55%;}}

/* scroll area */
.scroll{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 16px 26px;}
.scroll::-webkit-scrollbar{width:0;}

/* step heading */
.step-head h3{font-family:'Nunito';font-weight:900;font-size:22px;color:var(--navy);letter-spacing:-.5px;line-height:1.12;}
.mc-sub{font-size:13px;color:var(--muted-cool);margin-top:6px;margin-bottom:4px;line-height:1.45;}

.stage{animation:stageIn .32s cubic-bezier(.22,.9,.3,1) both;}
@keyframes stageIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

/* ── Category context bar — the "What do you need today?" line on detail steps.
   Tapping it returns to Step 1 (the picker = same screen as Home's Start a request). ── */
.cat-context{width:100%;display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:9px 12px;margin:0 0 16px;cursor:pointer;text-align:left;box-shadow:0 1px 0 rgba(0,36,97,.03);transition:border-color .15s,transform .1s;}
.cat-context:active{transform:scale(.99);}
.cat-context:hover{border-color:#cdd6e6;}
.cat-context .cc-thumb{width:40px;height:40px;border-radius:10px;overflow:hidden;flex:0 0 auto;background:var(--navy-light);}
.cat-context .cc-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.cat-context .cc-text{flex:1;display:flex;flex-direction:column;min-width:0;}
.cat-context .cc-eye{font-family:'Nunito';font-weight:800;font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted-cool);}
.cat-context .cc-name{font-family:'Nunito';font-weight:800;font-size:14px;color:var(--navy);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cat-context .cc-change{display:inline-flex;align-items:center;gap:1px;font-family:'Nunito';font-weight:800;font-size:12px;color:var(--green);flex:0 0 auto;}
.cat-context .cc-change svg{width:15px;height:15px;fill:none;stroke:var(--green);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}

/* ── Category grid (Step 1) — Gopher Go card design ── */
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:16px;}
.cat-tile{background:#fff;border:2px solid var(--border);border-radius:18px;padding:0 0 0;
  cursor:pointer;text-align:left;position:relative;transition:border-color .15s,box-shadow .15s,transform .1s;box-shadow:var(--card-sh);
  display:flex;flex-direction:column;}
.cat-tile:hover{border-color:#cbd6e6;}
.cat-tile:active{transform:scale(.985);}
.cat-tile.selected{border-color:var(--green-bright);box-shadow:0 0 0 3px rgba(51,217,117,.16),var(--card-sh);}
/* photo */
.cat-photo{position:relative;height:116px;border-radius:15px 15px 0 0;overflow:hidden;background:var(--navy-light);}
.cat-img{width:100%;height:100%;object-fit:cover;display:block;}
.cat-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,36,97,.05),rgba(0,36,97,.22));}
/* Gopher iQ tag (tap → popular requests) */
.cat-iq-tag{position:absolute;top:9px;right:9px;z-index:3;display:inline-flex;align-items:center;gap:5px;
  background:linear-gradient(135deg,var(--green-bright),var(--green));border:none;border-radius:99px;padding:4px 10px 4px 4px;
  box-shadow:0 3px 9px rgba(0,36,97,.28);cursor:pointer;transition:transform .1s,box-shadow .15s;}
.cat-iq-tag:hover{box-shadow:0 5px 14px rgba(28,176,97,.5);}
.cat-iq-tag:active{transform:scale(.94);}
.cat-iq-tag .iq-chip{display:inline-flex;align-items:center;justify-content:center;background:#fff;color:var(--navy);
  font-family:'Nunito';font-weight:900;font-size:10px;line-height:1;border-radius:7px;padding:3px 5px;letter-spacing:-.3px;}
.cat-iq-tag .iq-tag-word{font-family:'Nunito';font-weight:900;font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:#fff;line-height:1;}
/* body */
.cat-body{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 12px 12px;}
.cat-name{font-family:'Nunito';font-weight:900;font-size:13.5px;color:var(--navy);line-height:1.15;letter-spacing:-.2px;}
.cat-check{width:22px;height:22px;border-radius:50%;border:2px solid #d3dbe8;flex:0 0 auto;display:flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s;}
.cat-check.on{background:var(--green-bright);border-color:var(--green-bright);box-shadow:0 2px 6px rgba(28,176,97,.4);}
.cat-check svg{width:12px;height:12px;fill:none;stroke:var(--navy);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;}
/* popular-requests popover (tap the iQ tag) */
.cat-pop{position:absolute;top:40px;right:9px;z-index:40;width:205px;max-width:230px;
  background:linear-gradient(180deg,#2a3f5e,#1f3149);border-radius:14px;padding:13px 14px;
  box-shadow:0 18px 42px -8px rgba(0,18,46,.6);animation:catPopIn .16s ease both;cursor:default;}
@keyframes catPopIn{from{opacity:0;transform:translateY(-6px) scale(.97);}to{opacity:1;transform:none;}}
.cat-pop::before{content:"";position:absolute;top:-6px;right:40px;width:12px;height:12px;background:#2a3f5e;transform:rotate(45deg);border-radius:2px;}
/* Left-column cards (1st,3rd,5th,7th): open the popover to the RIGHT so it
   never runs off the phone's left edge; keep the arrow under the right-side tag. */
.cat-tile:nth-child(odd) .cat-pop{right:auto;left:9px;}
.cat-tile:nth-child(odd) .cat-pop::before{right:auto;left:112px;}
.cat-pop-title{font-family:'Nunito';font-weight:900;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--green-bright);margin-bottom:9px;line-height:1.3;}
.cat-pop-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;}
.cat-pop-list li{position:relative;padding-left:15px;font-family:'DM Sans';font-size:12px;color:#eaf1fb;line-height:1.3;}
.cat-pop-list li::before{content:"";position:absolute;left:2px;top:6px;width:5px;height:5px;border-radius:50%;background:var(--green-bright);}
.cat-pop-foot{margin-top:10px;padding-top:9px;border-top:1px solid rgba(255,255,255,.16);font-family:'DM Sans';font-style:italic;font-size:11px;color:#a9b9cf;line-height:1.45;}

/* ── Sections / fields ── */
.step-section{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px 15px;margin-top:16px;box-shadow:var(--card-sh);}
.sst{display:flex;align-items:center;gap:9px;font-family:'Nunito';font-weight:900;font-size:13.5px;color:var(--navy);margin-bottom:13px;letter-spacing:-.2px;}
.sst .sst-ico{width:30px;height:30px;border-radius:9px;background:var(--navy-light);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.sst .sst-ico svg{width:17px;height:17px;fill:none;stroke:var(--navy);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

.flabel{font-family:'Nunito';font-weight:700;font-size:11px;color:var(--muted-cool);text-transform:uppercase;letter-spacing:.6px;display:block;margin-bottom:6px;}
.field-textarea,.field-input{width:100%;border:1.5px solid #e4e8f0;border-radius:14px;padding:12px 13px;font-family:'DM Sans';font-size:14px;color:var(--text);background:#fff;resize:none;transition:border-color .15s,box-shadow .15s;}
.field-textarea:focus,.field-input:focus{outline:none;border-color:var(--green-bright);box-shadow:0 0 0 3px rgba(51,217,117,.16);}
.field-textarea::placeholder,.field-input::placeholder{color:#9aa6bd;}
.field-select{width:100%;border:1.5px solid #e4e8f0;border-radius:14px;padding:12px 13px;font-family:'DM Sans';font-size:14px;color:var(--text);background:#fff url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23002461' stroke-width='2.4' stroke-linecap='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E") no-repeat right 12px center;background-size:15px;appearance:none;-webkit-appearance:none;cursor:pointer;}
.field-select:focus{outline:none;border-color:var(--green-bright);box-shadow:0 0 0 3px rgba(51,217,117,.16);}
.field-row.split{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.field-block{margin-top:12px;}
.field-block:first-child{margin-top:0;}

/* add-pic */
.field-addpic{display:flex;align-items:center;gap:9px;width:100%;margin-top:11px;border:1.5px dashed #cdd6e6;background:#fbfcfe;border-radius:14px;padding:11px 13px;cursor:pointer;
  font-family:'Nunito';font-weight:800;font-size:12.5px;color:var(--navy-mid);transition:border-color .15s,background .15s;}
.field-addpic:hover{border-color:var(--green-bright);background:var(--green-light);}
.field-addpic .ap-ico{width:24px;height:24px;border-radius:50%;background:var(--green-bright);color:var(--navy);display:flex;align-items:center;justify-content:center;font-family:'Nunito';font-weight:900;font-size:17px;line-height:1;}
.pic-row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:11px;}
.pic-thumb{width:54px;height:54px;border-radius:12px;overflow:hidden;position:relative;border:1px solid var(--border);background:linear-gradient(135deg,#cfe9da,#bcd9f0);}
.pic-thumb .ph-emoji{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:24px;}
.pic-thumb-x{position:absolute;top:2px;right:2px;width:18px;height:18px;border:none;border-radius:50%;background:rgba(0,36,97,.82);color:#fff;font-size:12px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.pic-add-more{width:54px;height:54px;border-radius:12px;border:1.5px dashed #cdd6e6;background:#fbfcfe;color:var(--navy-mid);font-size:22px;font-weight:300;cursor:pointer;}
.pic-count{font-family:'DM Sans';font-size:11px;color:var(--muted-cool);}

/* ── Toggle rows ── */
.toggle-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid #f1f3f8;}
.toggle-row:first-of-type{border-top:none;padding-top:2px;}
.toggle-row.spaced{justify-content:space-between;}
.toggle-row.auto-on .tr-label{color:var(--green);}
.toggle-switch{width:46px;height:27px;border-radius:99px;background:#dde3ec;border:none;position:relative;cursor:pointer;flex:0 0 auto;transition:background .2s;}
.toggle-switch::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,36,97,.3);transition:transform .2s;}
.toggle-switch.on{background:linear-gradient(135deg,var(--green-bright),var(--green));}
.toggle-switch.on::after{transform:translateX(19px);}
.tr-label{font-family:'Nunito';font-weight:700;font-size:12.5px;color:var(--text);line-height:1.35;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.auto-on-chip{font-family:'Nunito';font-weight:800;font-size:9.5px;color:var(--green);background:var(--green-light);padding:3px 8px;border-radius:99px;}

/* info button + popover */
.info-tip{position:relative;display:inline-flex;align-items:center;vertical-align:middle;}
.info-btn{width:17px;height:17px;border-radius:50%;border:1.5px solid #c4cee0;background:#fff;color:var(--navy-mid);font-family:'Nunito';font-weight:900;font-size:10.5px;line-height:1;cursor:pointer;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;padding:0;}
.info-popover{position:absolute;z-index:40;left:0;top:24px;width:248px;max-width:calc(100vw - 24px);background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:var(--over-sh);padding:13px 14px;display:none;}
.info-tip.open .info-popover,.info-row.open .info-popover{display:block;animation:stageIn .18s ease both;}
.info-popover h5{font-family:'Nunito';font-weight:900;font-size:12.5px;color:var(--navy);margin-bottom:6px;}
.info-popover p{font-size:11.5px;color:var(--text);margin-bottom:7px;line-height:1.45;}
.info-popover p.emphasis{color:var(--warning-text);font-weight:600;background:#fff7c2;padding:7px 9px;border-radius:9px;margin-bottom:0;}

/* sub-field */
.sub-field{background:#f7f9fc;border:1px solid #eef1f7;border-radius:13px;padding:12px 13px;margin-top:11px;}
.sf-label{font-family:'Nunito';font-weight:800;font-size:12px;color:var(--navy);margin-bottom:3px;}
.sf-value{font-size:12px;color:var(--muted-cool);line-height:1.45;}
.sf-hint{font-family:'DM Sans';font-size:11px;color:var(--muted-cool);margin-top:6px;}

/* AR banner CSS removed 2026-08-22 — element deleted 2026-08-19; .su-ar-banner is a DIFFERENT live class. */
/* age-keyword awareness banner */
.age-kw-banner{background:linear-gradient(135deg,#fff7c2,#fff2d6);border:1px solid #f3e09a;display:flex;align-items:flex-start;gap:11px;}
.age-kw-banner .ar-mark{width:30px;height:30px;border-radius:9px;background:var(--warning);display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin-top:1px;}
.age-kw-banner .ar-mark svg{width:18px;height:18px;fill:none;stroke:var(--warning-text);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.age-kw-banner .sf-label{color:var(--warning-text);}
.age-kw-banner .sf-value{color:#8a6a1f;margin-top:2px;line-height:1.4;}
/* Resume banner. Same visual language as .age-kw-banner but calm (not a warning):
   this is an offer, not a compliance stop. ⚠️ Explicit display on the element --
   this file has NO global [hidden]{display:none}, so anything relying on the hidden
   attribute renders anyway. Shown/hidden by add/remove, never by [hidden]. */
/* Resume banner. Built on the LIVE .si-band idiom (si-ico + si-text > h5 + p),
   not on .age-kw-banner -- that banner was RETIRED 2026-08-18 and only its orphan
   CSS survives, so matching it meant matching a corpse (App Prototypes, 2026-08-26).
   .si-band WRAPS rather than clipping, which is precisely the property the first
   build got wrong. Recoloured calm-blue only: this is an offer, not a warning.
   ⚠️ No global [hidden]{display:none} in this file -- shown/hidden by add/remove. */
/* Resume banner — brand colours only, from the surface's own tokens.
   ⛔ The first build invented #2f6fd0. That is not a Gopher colour. Canon
   (Documentation/Brand/, Style Guide 2026): navy #002461, green #33D975,
   Sand #FBF3E4, Terracotta #D97757. This band is SAND + NAVY: an official pair,
   and deliberately not the green .si-band treatment, which reads as success
   rather than as an offer.
   ⚠️ Owner ruling 2026-08-25: on #33D975 the ink must be NAVY, never white.
   Only --green-dark/#1CB061 may carry white — which is why the primary button
   below is navy, not green.
   ⚠️ Compound selectors: .si-band is declared LATER in this stylesheet, so a bare
   .dr-resume loses on source order and the band rendered green.
   ⚠️ align-items is INHERITED from .si-band (center), not overridden. An earlier
   build forced flex-start, which pinned the icon 15px from the top of a ~105px
   band while leaving 90px beneath it -- the band read as top-heavy. Owner called
   it 2026-08-26.
   ⚠️ margin is 14px TOP AND BOTTOM: with `14px 0 0` the band sat flush against the
   step content below it (measured gap: 0px), so the offer and the page ran
   together.
   ⚠️ margin has NO horizontal component: the stage content sits flush to #content
   (measured left 461 / width 358) and a 14px inset put this band at 475 — visibly
   narrower than everything under it. */
.si-band.dr-resume{background:var(--sand,#FBF3E4);border:1px solid #efe2c9;border-radius:var(--radius,18px);margin:14px 0;}
.si-band.dr-resume .si-ico{background:var(--navy,#002461);color:#fff;font-size:17px;}
.si-band.dr-resume .si-text h5{color:var(--navy,#002461);}
.si-band.dr-resume .si-text p{color:#4a4335;}
.si-band.dr-resume .dr-where{color:#7a6f5c;margin-top:3px;font-size:11.5px;line-height:1.3;}
.si-band.dr-resume .dr-acts{display:flex;gap:8px;margin-top:10px;}
.si-band.dr-resume button{font:inherit;font-size:12.5px;font-weight:600;border-radius:10px;padding:8px 14px;cursor:pointer;border:1px solid var(--navy,#002461);background:transparent;color:var(--navy,#002461);}
.si-band.dr-resume button.dr-primary{background:var(--navy,#002461);border-color:var(--navy,#002461);color:#fff;}
.age-kw-actions{display:flex;gap:14px;margin-top:12px;}
.age-kw-actions .ts-promo-btn{padding:7px 13px;}
.age-kw-actions .age-kw-no{background:#fff;color:var(--navy);border:1.5px solid #e3d7a0;}
/* ghost (locked) radio option */
.radio-row.ghost{opacity:.6;cursor:not-allowed;border-style:dashed;}
.radio-row.ghost .radio-dot{border-color:#c7d0e0;background:repeating-linear-gradient(45deg,#eef0f5,#eef0f5 3px,#fff 3px,#fff 6px);}
.radio-row.ghost .rr-label{color:var(--muted-cool);}
.rr-lock-hint{display:block;font-size:10.5px;color:var(--muted-cool);font-weight:500;margin-top:3px;line-height:1.35;}
.rr-lock-hint svg{width:11px;height:11px;fill:none;stroke:var(--navy-mid);stroke-width:1.8;vertical-align:-1px;margin-right:2px;}
.rr-lock-hint b{color:var(--navy-mid);font-weight:800;}

/* TrustShield promo */
.ts-promo{display:flex;align-items:center;gap:11px;background:var(--navy);border-radius:13px;padding:12px 13px;margin-top:11px;}
.ts-shield{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.ts-shield svg{width:18px;height:18px;fill:none;stroke:var(--green-bright);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.ts-promo-text{flex:1;}
.ts-promo-text h5{font-family:'Nunito';font-weight:900;font-size:12px;color:#fff;}
.ts-promo-text p{font-size:10.5px;color:#bcd0e8;line-height:1.35;margin-top:1px;}
.ts-promo-btn{font-family:'Nunito';font-weight:900;font-size:11px;color:var(--navy);background:linear-gradient(135deg,var(--green-bright),var(--green));border:none;padding:8px 12px;border-radius:99px;cursor:pointer;white-space:nowrap;flex:0 0 auto;}

/* ===== Age-restricted identity controls + live ID capture =====================
   Ported from Final/gopher-request.html 2026-08-25 (owner: "virtually replicate the
   flow of connect and request"). Web values kept where they carry meaning (the ID-1
   card guide is 1.586:1 because that IS a driver's licence); sizes reflowed for the
   375px phone frame instead of a 440px desktop modal. Uses this file's own tokens. */
.ar-control{display:flex;flex-direction:column;align-items:stretch;gap:8px;margin-top:11px;}
/* Slide 1 of AR Flow.pptx (owner, 2026-08-25): the submit action is NAVY and the
   TrustShield action is GREEN — the two are different offers and must not read as
   one repeated button. The explanatory narrative that used to sit here was removed
   with it; the TrustShield card below already carries that copy. */
.ar-action{font-family:'Nunito';font-weight:900;font-size:12.5px;color:#fff;background:var(--navy);
  border:none;border-radius:10px;padding:11px 14px;cursor:pointer;line-height:1.1;width:100%;
  transition:background .18s,transform .18s;}
.ar-action:active{transform:translateY(1px);}
.ar-action-note{display:flex;align-items:center;justify-content:center;gap:8px;
  font-family:'DM Sans';font-size:11.5px;color:var(--muted-cool);margin:0;}
.ar-tsbtn{font-family:'Nunito';font-weight:900;font-size:12.5px;color:var(--ink-on-green);
  background:var(--green);border:none;border-radius:10px;padding:11px 14px;cursor:pointer;
  line-height:1.1;flex:1 1 auto;transition:background .18s,transform .18s;}
.ar-tsbtn:active{transform:translateY(1px);}
.ar-id-done{display:flex;align-items:center;gap:10px;background:var(--green-light);
  border:1px solid #bfe6cf;border-radius:13px;padding:10px 12px;margin-top:11px;}
.ar-id-done .ar-id-check{font-size:20px;}
.ar-id-label{font-family:'Nunito';font-weight:900;font-size:12px;color:var(--green);flex:1;}
.ar-id-update{font-family:'Nunito';font-weight:800;font-size:11px;color:var(--green);
  background:none;border:none;cursor:pointer;text-decoration:underline;}

/* ---- live capture sheet (same bottom-sheet primitive as the signup pop-up) ---- */
.idc-back{position:absolute;inset:0;z-index:130;background:rgba(0,16,42,.46);
  opacity:0;pointer-events:none;transition:opacity .22s;}
.idc-back.show{opacity:1;pointer-events:auto;}
.idc-sheet{position:absolute;left:0;right:0;bottom:0;z-index:131;background:var(--card);
  border-radius:22px 22px 0 0;box-shadow:var(--over-sh);transform:translateY(102%);
  transition:transform .26s cubic-bezier(.22,.9,.3,1);max-height:94%;display:flex;
  flex-direction:column;padding:16px 16px calc(14px + env(safe-area-inset-bottom));}
.idc-sheet.show{transform:translateY(0);}
.idc-body{overflow-y:auto;-webkit-overflow-scrolling:touch;}
.idc-title{font-family:'Nunito';font-weight:900;font-size:17px;color:var(--navy);line-height:1.2;}
.idc-sub{font-family:'DM Sans';font-size:12px;color:var(--ink-soft);margin-top:5px;line-height:1.45;}
.idc-steps{display:flex;gap:6px;margin:13px 0 14px;}
.idc-chip{flex:1 1 0;font-family:'Nunito';font-weight:800;font-size:9.5px;text-transform:uppercase;
  letter-spacing:.4px;text-align:center;padding:7px 4px;border-radius:8px;background:#f0f2f7;color:var(--muted-cool);}
.idc-chip.done{background:var(--green);color:var(--ink-on-green);}
.idc-chip.active{background:var(--navy);color:#fff;}   /* .active wins over .done — a
  captured-but-current step must not read as finished (web v95) */
.idc-step{display:none;}
.idc-step.on{display:block;}
.idc-step h5{font-family:'Nunito';font-weight:900;font-size:14px;color:var(--navy);}
.idc-hint{font-family:'DM Sans';font-size:11.5px;color:var(--ink-soft);line-height:1.45;margin-top:5px;}
.idc-cap{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  min-height:92px;margin-top:12px;padding:12px;border:2px dashed #cfd6e4;border-radius:12px;
  background:#fafbfd;cursor:pointer;font-family:'Nunito';font-weight:800;font-size:12px;color:var(--navy);}
.idc-cap-ico{font-size:24px;}
.idc-thumb{margin-top:12px;display:flex;align-items:center;gap:10px;padding:8px;
  border:1px solid var(--line-cool);border-radius:10px;background:#fff;}
.idc-thumb[hidden]{display:none;}   /* ⚠️ .idc-thumb sets display:flex, which beats the
  browser default [hidden] rule — this file has no global [hidden] guard (see the
  2026-07-27 referral-engine finding). Without this line every thumb renders at once. */
.idc-thumb img{width:60px;height:42px;object-fit:cover;border-radius:6px;flex:0 0 auto;background:#0d1530;}
.idc-thumb-meta{font-family:'DM Sans';font-size:11.5px;color:var(--text);line-height:1.35;}
.idc-thumb-meta b{color:var(--green);}
.idc-retake{margin-left:auto;font-family:'Nunito';font-weight:800;font-size:11px;color:var(--green);
  background:none;border:none;cursor:pointer;text-decoration:underline;flex:0 0 auto;}
.idc-camwrap{position:relative;margin-top:10px;border-radius:14px;overflow:hidden;background:#0d1530;
  aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;}
.idc-camwrap video{width:100%;height:100%;object-fit:cover;}
.idc-camwrap video.mirror{transform:scaleX(-1);}
.idc-guide{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;}
/* ID-1 proportion (85.6 x 54 mm = 1.586:1) — the real shape of a licence, so filling
   it yields a straight, fully-in-frame capture. Selfie swaps it for an oval. */
.idc-guide-win{position:relative;width:86%;aspect-ratio:1.586/1;border-radius:12px;
  box-shadow:0 0 0 9999px rgba(6,14,38,.55);}
.idc-guide-win span{position:absolute;width:24px;height:24px;border:3px solid var(--green-bright);}
.idc-guide-win span:nth-child(1){top:-2px;left:-2px;border-right:none;border-bottom:none;border-radius:12px 0 0 0;}
.idc-guide-win span:nth-child(2){top:-2px;right:-2px;border-left:none;border-bottom:none;border-radius:0 12px 0 0;}
.idc-guide-win span:nth-child(3){bottom:-2px;left:-2px;border-right:none;border-top:none;border-radius:0 0 0 12px;}
.idc-guide-win span:nth-child(4){bottom:-2px;right:-2px;border-left:none;border-top:none;border-radius:0 0 12px 0;}
.idc-guide.face .idc-guide-win{width:62%;aspect-ratio:.78/1;border-radius:50%;}
.idc-guide.face .idc-guide-win span{display:none;}
.idc-err{margin-top:10px;padding:9px 11px;border-radius:9px;background:rgba(225,72,72,.08);
  border:1px solid rgba(225,72,72,.28);font-family:'DM Sans';font-size:11.5px;line-height:1.4;color:#b3261e;}
.idc-err[hidden]{display:none;}
.idc-actions{display:flex;flex-direction:column;gap:9px;margin-top:16px;}
.idc-btn{width:100%;font-family:'Nunito';font-weight:900;font-size:13.5px;color:var(--ink-on-green);
  background:linear-gradient(135deg,var(--green-bright),var(--green));border:none;border-radius:12px;
  padding:13px;cursor:pointer;}
.idc-btn[disabled]{opacity:.45;cursor:not-allowed;}
.idc-btn.sec{background:#eef0f5;color:var(--navy);}
.idc-note{margin-top:11px;font-family:'DM Sans';font-size:10.5px;color:var(--muted-cool);line-height:1.4;}
.idc-done-msg{text-align:center;padding:6px 0 2px;}
.idc-done-ico{font-size:38px;}
.idc-stores{display:flex;gap:9px;justify-content:center;margin-top:13px;}
.idc-stores img{height:38px;}
.ts-verified{display:flex;align-items:center;gap:7px;background:var(--green-light);border:1px solid #bfe6cf;border-radius:13px;padding:11px 13px;margin-top:11px;font-family:'Nunito';font-weight:800;font-size:12px;color:var(--green);}
.ts-verified svg{width:18px;height:18px;fill:none;stroke:var(--green);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}

/* cost input */
.cost-input-box{display:flex;align-items:center;border:1.5px solid #e4e8f0;border-radius:14px;padding:0 13px;background:#fff;margin-top:6px;transition:border-color .15s,box-shadow .15s;}
.cost-input-box:focus-within{border-color:var(--green-bright);box-shadow:0 0 0 3px rgba(51,217,117,.16);}
.ci-currency{font-family:'Nunito';font-weight:900;font-size:16px;color:var(--navy);margin-right:4px;}
.cost-amount-input{flex:1;border:none;outline:none;padding:12px 0;font-family:'Nunito';font-weight:800;font-size:16px;color:var(--navy);background:transparent;}
.cost-amount-input::placeholder{color:#b6c0d4;font-weight:600;}

/* counter */
.field-counter{display:inline-flex;align-items:center;gap:2px;background:#f3f5fa;border-radius:12px;padding:4px;}
.counter-btn{width:32px;height:32px;border:none;border-radius:9px;background:#fff;color:var(--navy);font-family:'Nunito';font-weight:900;font-size:18px;line-height:1;cursor:pointer;box-shadow:0 1px 2px rgba(0,36,97,.1);transition:transform .1s;}
.counter-btn:active{transform:scale(.9);}
.counter-btn:disabled{opacity:.35;cursor:default;box-shadow:none;}
.counter-val{min-width:34px;text-align:center;font-family:'Nunito';font-weight:900;font-size:15px;color:var(--navy);}

/* radio rows */
.radio-group{display:flex;flex-direction:column;gap:9px;}
.radio-row{display:flex;align-items:flex-start;gap:11px;border:1.5px solid #e4e8f0;border-radius:14px;padding:13px;cursor:pointer;transition:border-color .15s,background .15s;}
.radio-row:hover{border-color:#cbd6e6;}
.radio-row.selected{border-color:var(--green-bright);background:var(--green-light);}
.radio-dot{width:20px;height:20px;border-radius:50%;border:2px solid #c4cee0;flex:0 0 auto;margin-top:1px;position:relative;transition:border-color .15s;}
.radio-row.selected .radio-dot{border-color:var(--green);}
.radio-row.selected .radio-dot::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--green);}
.rr-label{font-family:'Nunito';font-weight:700;font-size:13px;color:var(--navy);line-height:1.35;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}


/* address block */
.addr-block{position:relative;}
.addr-pin{position:absolute;left:13px;top:13px;width:18px;height:18px;}
.addr-pin svg{width:18px;height:18px;fill:none;stroke:var(--green);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.addr-input{width:100%;border:1.5px solid #e4e8f0;border-radius:14px;padding:12px 13px 12px 38px;font-family:'DM Sans';font-size:13.5px;color:var(--text);background:#fff;transition:border-color .15s,box-shadow .15s;}
.addr-input:focus{outline:none;border-color:var(--green-bright);box-shadow:0 0 0 3px rgba(51,217,117,.16);}
.trip-distance{display:flex;align-items:center;gap:7px;margin-top:13px;font-family:'Nunito';font-weight:800;font-size:12px;color:var(--navy-mid);background:var(--navy-light);border-radius:11px;padding:10px 12px;}
.trip-distance svg{width:16px;height:16px;fill:none;stroke:var(--navy-mid);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

/* ── Gopher iQ pay-suggest helper (ported from Gopher Request) ── */
.ai-helper-row{position:relative;overflow:hidden;margin-top:12px;display:flex;align-items:center;gap:10px;padding:11px 13px;
  background:linear-gradient(135deg,rgba(51,217,117,.10),rgba(26,42,94,.04));border:1.5px solid rgba(51,217,117,.55);
  border-radius:14px;cursor:pointer;box-shadow:0 6px 20px -10px rgba(51,217,117,.55);
  transition:border-color .16s,background .16s,box-shadow .16s,transform .16s;}
.ai-helper-row:hover{border-color:var(--green-bright);background:linear-gradient(135deg,rgba(51,217,117,.16),rgba(26,42,94,.06));box-shadow:0 10px 26px -10px rgba(51,217,117,.7);}
.ai-helper-row .ai-head{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.ai-helper-row .ai-head img{height:16px;width:auto;object-fit:contain;display:block;}
.ai-helper-row .ai-text{flex:1;font-family:'Nunito';font-weight:800;font-size:12px;color:var(--navy);line-height:1.2;}
.ai-helper-row .ai-arrow{flex-shrink:0;width:28px;height:28px;border-radius:50%;background:var(--green-bright);color:#fff;
  display:inline-flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;line-height:1;
  box-shadow:0 4px 10px -3px rgba(51,217,117,.8);transition:transform .16s,background .16s;}
.ai-helper-row:hover .ai-arrow{background:var(--green);transform:translateX(3px);}
.ai-helper-row::after{content:'';position:absolute;top:0;bottom:0;left:-60%;width:45%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-18deg);
  animation:aiHelperShine 5.5s ease-in-out infinite;pointer-events:none;}
@keyframes aiHelperShine{0%,72%{left:-60%;}88%,100%{left:120%;}}
@media (prefers-reduced-motion:reduce){.ai-helper-row::after{animation:none;display:none;}.ai-helper-row,.ai-helper-row .ai-arrow{transition:none;}}
/* iQ offer slider panel */
/* Gopher iQ offer modal — dominates the phone screen */
.offer-modal{position:absolute;inset:0;z-index:80;}
.offer-backdrop{position:absolute;inset:0;background:rgba(0,18,46,.55);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);animation:obFade .18s ease both;}
@keyframes obFade{from{opacity:0;}to{opacity:1;}}
.offer-card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:calc(100% - 36px);max-width:330px;
  background:#fff;border-radius:20px;padding:18px 18px 16px;box-shadow:0 24px 60px -10px rgba(0,18,46,.55);
  animation:obCard .22s cubic-bezier(.2,.9,.3,1) both;}
@keyframes obCard{from{opacity:0;transform:translate(-50%,-46%) scale(.96);}to{opacity:1;transform:translate(-50%,-50%) scale(1);}}
.os-panel-head{display:flex;align-items:center;gap:9px;margin-bottom:12px;}
.os-panel-head .os-logo{height:24px;width:auto;}
.os-panel-head span{font-family:'Nunito';font-weight:900;font-size:13px;color:var(--navy);}
.os-trip{font-family:'Nunito';font-weight:700;font-size:11.5px;color:var(--navy);background:var(--green-light);border-radius:8px;padding:7px 11px;margin-bottom:12px;line-height:1.4;}
.os-trip-est{font-weight:600;color:var(--muted-cool);}
/* Junk volume-tier selector — visual parity with the web apps' .os-tier (owner 2026-07-19) */
.os-junk-tiers{display:flex;gap:7px;margin:2px 0 10px;}
.os-tier{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:2px;padding:9px 8px;
  border:1.5px solid #e4e8f0;border-radius:12px;background:#fff;cursor:pointer;text-align:left;
  font-family:'DM Sans',sans-serif;transition:border-color .12s, background .12s, box-shadow .12s;}
.os-tier:hover{border-color:var(--green);}
.os-tier.active{border-color:var(--green);background:var(--green-light);box-shadow:0 0 0 2px rgba(28,176,97,.18);}
.os-tier-name{font-family:'Nunito';font-weight:800;font-size:12.5px;color:var(--navy);line-height:1.15;}
.os-tier-hint{font-size:10px;color:var(--muted-cool);line-height:1.25;}
.os-tier:focus-visible{outline:2px solid var(--green);outline-offset:2px;}
.os-slider-wrap{margin:2px 0 4px;padding:12px 6px 8px;background:var(--navy-light);border-radius:13px;}
.os-rail-labels,.os-rail-vals{display:grid;grid-template-columns:1fr auto 1fr;align-items:baseline;font-family:'Nunito';padding:0 4px;}
.os-rail-labels{font-size:10.5px;font-weight:800;margin-bottom:8px;text-transform:uppercase;letter-spacing:.03em;}
.os-lab-low{color:var(--muted-cool);text-align:left;} .os-lab-fair{color:var(--green);text-align:center;} .os-lab-gen{color:var(--green);text-align:right;}
.os-rail-vals{font-size:12.5px;font-weight:800;color:var(--navy);margin-top:8px;}
.os-rail-vals span:first-child{text-align:left;} .os-rail-dash{text-align:center;color:var(--muted-cool);} .os-rail-vals span:last-child{text-align:right;}
.os-slider{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:99px;outline:none;cursor:pointer;margin:0;
  background:linear-gradient(90deg,#d6dce8 0%,var(--green-bright) 50%,#d6dce8 100%);}
.os-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:4px solid var(--green-bright);cursor:pointer;box-shadow:0 2px 6px rgba(0,36,97,.22);transition:transform .12s;}
.os-slider::-webkit-slider-thumb:active{transform:scale(1.12);}
.os-slider::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:4px solid var(--green-bright);cursor:pointer;box-shadow:0 2px 6px rgba(0,36,97,.22);}
.os-amount-block{margin:16px 0 4px;text-align:center;}
.os-amount-label{font-family:'Nunito';font-weight:700;font-size:10.5px;color:var(--muted-cool);margin-bottom:7px;text-transform:uppercase;letter-spacing:.05em;}
.os-amount-input-box{display:inline-flex;align-items:center;gap:5px;border:1.5px solid #dfe3ec;border-radius:12px;padding:6px 20px;background:#fff;transition:border-color .15s,box-shadow .15s;}
.os-amount-input-box:focus-within{border-color:var(--green-bright);box-shadow:0 0 0 3px rgba(51,217,117,.12);}
.os-amount-currency{font-family:'DM Sans';font-weight:600;font-size:22px;color:var(--navy);opacity:.85;}
.os-amount-input{border:none;outline:none;width:84px;text-align:center;background:transparent;font-family:'DM Sans';font-weight:600;font-size:26px;color:var(--navy);}
.os-hint{font-family:'DM Sans';font-size:11.5px;color:var(--muted-cool);margin-top:9px;line-height:1.4;min-height:16px;}
.os-hint.warn{color:var(--error);font-weight:600;} .os-hint.over{color:var(--green);font-weight:600;}
.os-actions{display:flex;gap:9px;margin-top:13px;}
.os-cancel{flex:0 0 auto;border:1.5px solid #dfe3ec;background:#fff;border-radius:12px;padding:10px 16px;font-family:'Nunito';font-weight:800;font-size:12.5px;color:var(--navy);cursor:pointer;}
.os-use{flex:1;border:none;border-radius:12px;padding:10px;font-family:'Nunito';font-weight:900;font-size:13px;color:var(--navy);background:linear-gradient(135deg,var(--green-bright),var(--green));cursor:pointer;box-shadow:0 4px 12px -3px rgba(51,217,117,.7);}

/* wage summary */
.wage-summary{background:#f7f9fc;border:1px solid #eef1f7;border-radius:12px;padding:11px 13px;margin-top:11px;}
.wage-row{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;}
.wage-row.total{border-top:1px dashed #dde3ec;margin-top:4px;padding-top:8px;}
.wage-label{font-family:'Nunito';font-weight:700;font-size:11.5px;color:var(--muted-cool);}
.wage-row.total .wage-label{color:var(--navy);}
.wage-value{font-family:'Nunito';font-weight:900;font-size:13px;color:var(--navy);}
.wage-value small{font-family:'DM Sans';font-weight:400;font-size:10px;color:var(--muted-cool);}

/* low offer notice */
.low-offer{display:flex;gap:9px;background:#fff7c2;border:1px solid #f3e09a;border-radius:12px;padding:11px 12px;margin-top:11px;}
.low-offer svg{width:18px;height:18px;fill:none;stroke:var(--warning-text);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;margin-top:1px;}
.low-offer p{font-size:11.5px;color:var(--warning-text);line-height:1.45;}
/* DEMO sim bars on the submitted screen (see renderStep7). Deliberately styled as dev
   chrome, not product: dashed border and a DEMO tag, so a reviewer can never mistake
   one for a real notification. */
.g40-simbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:10px;padding:9px 11px;border:1px dashed #c9d2e3;border-radius:10px;background:#eef0f8;}
.g40-simtag{font-family:'Nunito';font-weight:900;font-size:9px;letter-spacing:.08em;color:#fff;background:#3A4D74;border-radius:5px;padding:2px 6px;}
.g40-simnote{flex:1;min-width:120px;font-family:'DM Sans';font-size:10.5px;color:#3A4D74;line-height:1.35;}
.g40-simbtn{font-family:'Nunito';font-weight:800;font-size:11px;color:var(--navy);background:#fff;border:1px solid #c9d2e3;border-radius:8px;padding:6px 10px;cursor:pointer;}

/* ── Review card ── */
.review-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:6px 15px;margin-top:16px;box-shadow:var(--card-sh);}
.review-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:11px 0;border-top:1px solid #f1f3f8;}
.review-row:first-child{border-top:none;}
.review-row .rl{font-family:'Nunito';font-weight:700;font-size:12px;color:var(--muted-cool);display:flex;align-items:center;gap:6px;flex:0 0 auto;}
.review-row .rv{font-family:'Nunito';font-weight:800;font-size:12.5px;color:var(--navy);text-align:right;}
.review-row.earn .rv{color:var(--navy);}
.review-row.total{border-top:2px solid var(--navy-light);margin-top:2px;}
.review-row.total .rl{font-family:'Nunito';font-weight:900;font-size:14px;color:var(--navy);}
.review-row.total .rv{font-family:'Nunito';font-weight:900;font-size:20px;color:var(--navy);letter-spacing:-.5px;}
.review-thumbs{display:flex;gap:5px;justify-content:flex-end;}
.review-thumb{width:30px;height:30px;border-radius:8px;overflow:hidden;background:linear-gradient(135deg,#cfe9da,#bcd9f0);display:flex;align-items:center;justify-content:center;font-size:15px;}

/* fee popover */
.fee-tip{position:relative;align-self:center;}
.fee-popover,.wpay-popover{width:248px;left:0;right:auto;}
.fee-items{display:flex;flex-direction:column;gap:5px;margin-bottom:8px;}
.fee-item{display:flex;justify-content:space-between;font-family:'DM Sans';font-size:11.5px;color:var(--text);}
.fee-item span:last-child{font-family:'Nunito';font-weight:800;color:var(--navy);}
.fee-item-promo span{color:var(--green)!important;}
.fee-item-total{border-top:1px dashed #dde3ec;padding-top:6px;margin-top:2px;}
.fee-item-total span{font-family:'Nunito';font-weight:900;}
.fee-item-sub{border-top:1px dashed #dde3ec;padding-top:6px;margin-top:2px;}
.fee-item-sub span{font-family:'Nunito';font-weight:800;}
.fee-note{font-size:10.5px;color:var(--muted-cool);line-height:1.4;}

/* promo */
.promo-entry{display:flex;gap:7px;justify-content:flex-end;}
.promo-input{width:108px;border:1.5px solid #e4e8f0;border-radius:10px;padding:7px 9px;font-family:'Nunito';font-weight:800;font-size:11.5px;color:var(--navy);text-transform:uppercase;}
.promo-input:focus{outline:none;border-color:var(--green-bright);}
.promo-input-error{border-color:var(--error);}
.promo-apply{font-family:'Nunito';font-weight:900;font-size:11px;color:#fff;background:var(--navy);border:none;border-radius:10px;padding:7px 13px;cursor:pointer;}
.promo-applied{display:flex;align-items:center;gap:7px;justify-content:flex-end;}
.promo-tag{font-family:'Nunito';font-weight:800;font-size:10.5px;color:var(--green);background:var(--green-light);padding:5px 9px;border-radius:99px;}
.promo-remove{width:18px;height:18px;border:none;border-radius:50%;background:#eef1f7;color:var(--navy-mid);font-size:12px;cursor:pointer;}
.promo-hint{display:block;text-align:right;font-size:10.5px;color:var(--error);margin-top:5px;}

/* payment picker */
.pay-picker{cursor:pointer;}
.pay-chev{display:inline-block;margin-left:6px;font-size:9px;color:var(--muted-cool);transition:transform .2s;}
.pay-picker.open .pay-chev{transform:rotate(180deg);}
.pay-panel{background:#f7f9fc;border:1px solid #eef1f7;border-radius:13px;padding:7px;margin:4px 0 11px;display:flex;flex-direction:column;gap:5px;}
.pay-opt{display:flex;align-items:center;gap:11px;padding:9px;border-radius:10px;cursor:pointer;background:#fff;border:1.5px solid transparent;transition:border-color .15s;}
.pay-opt:hover{border-color:#dde3ec;}
.pay-opt.selected{border-color:var(--green-bright);background:var(--green-light);}
.pmo-badge{width:38px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:'Nunito';font-weight:900;font-size:9px;color:#fff;flex:0 0 auto;}
.pmo-body{flex:1;}
.pmo-name{font-family:'Nunito';font-weight:800;font-size:12px;color:var(--navy);}
.pmo-sub{font-family:'DM Sans';font-size:10.5px;color:var(--muted-cool);}
.pmo-tick{width:18px;height:18px;border-radius:50%;border:2px solid #d4dce8;flex:0 0 auto;}
.pay-opt.selected .pmo-tick{border-color:var(--green);background:var(--green);}
.pay-opt.add-new .pmo-badge{background:#eef1f7;color:var(--navy);font-size:18px;}

/* ── Second set of eyes (Gopher iQ review — ported from Gopher Request) ── */
.sse-block{margin-top:16px;border:1.5px solid #d9e8ff;border-radius:14px;background:linear-gradient(180deg,#f5f9ff 0%,#fff 100%);overflow:hidden;transition:border-color .2s;}
.sse-block.open{border-color:var(--green-bright);}
.sse-block.attn-pulse{border-color:#e3a0ad;animation:attnRedGlow 2.6s ease-in-out infinite;will-change:box-shadow;}
@keyframes attnRedGlow{0%,100%{box-shadow:0 2px 8px rgba(196,66,87,.30);}50%{box-shadow:0 4px 22px rgba(196,66,87,.62);}}
@media (prefers-reduced-motion:reduce){.sse-block.attn-pulse{animation:none;box-shadow:0 3px 14px rgba(196,66,87,.45);}}
.sse-head{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;}
.sse-brain{flex-shrink:0;height:42px;display:inline-flex;align-items:center;}
.sse-brain img{height:42px;width:auto;display:block;}
.sse-head-text{flex:1;}
.sse-head-text h4{font-family:'Nunito';font-weight:900;font-size:14.5px;color:var(--navy);}
.sse-head-text p{font-family:'DM Sans';font-size:12px;color:var(--muted-cool);margin-top:2px;line-height:1.4;}
.sse-chev{color:var(--green);font-size:11px;flex:0 0 auto;}
.sse-body{padding:4px 16px 16px;border-top:1px solid #e4eeff;animation:sseIn .2s ease;}
@keyframes sseIn{from{opacity:0;}to{opacity:1;}}
.sse-flag{background:#fff5e6;border:1px solid #ffe2b0;border-radius:9px;padding:9px 12px;margin:12px 0 4px;font-family:'DM Sans';font-size:12px;color:#b07400;line-height:1.45;}
.sse-flag b{font-weight:800;}
/* Positive counterpart to .sse-flag — shown when the request is abundantly clear (affirm, no advice). */
.sse-affirm{background:var(--green-light);border:1px solid #cdeeda;border-radius:9px;padding:11px 13px;margin:12px 0 4px;font-family:'DM Sans';font-size:12.5px;color:#0f6e56;font-weight:600;line-height:1.45;}
.sse-intro{font-family:'DM Sans';font-size:12.5px;color:var(--navy);margin:12px 0 8px;line-height:1.5;}
.sse-points{list-style:none;display:flex;flex-direction:column;gap:7px;margin:0 0 12px;padding:0;}
.sse-points li{position:relative;padding-left:22px;font-family:'DM Sans';font-size:12.5px;color:var(--text);line-height:1.45;}
.sse-points li::before{content:'✓';position:absolute;left:0;top:0;color:var(--green);font-weight:900;font-size:12px;}
.sse-points li b{font-family:'Nunito';font-weight:700;color:var(--navy);}
.sse-cta{font-family:'DM Sans';font-size:12px;color:var(--navy);margin:0 0 9px;font-weight:600;}
.sse-jumps{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px;}
.sse-jump{text-align:left;border:1.5px solid #cfe0f7;background:#fff;border-radius:8px;padding:7px 11px;cursor:pointer;font-family:'Nunito';font-weight:700;font-size:11.5px;color:var(--navy);transition:all .14s;}
.sse-jump:hover{border-color:var(--green-bright);color:var(--green);background:#f6fbf7;}
.sse-fine{font-family:'DM Sans';font-size:10.5px;color:var(--muted-cool);margin:0;line-height:1.45;font-style:italic;}
.sse-fine b{color:var(--navy);font-weight:700;}

/* what to expect */
.section-label{font-family:'Nunito';font-weight:900;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--green);margin:20px 2px 0;}
.wte{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:15px;margin-top:11px;box-shadow:var(--card-sh);}
.wte-list{list-style:none;display:flex;flex-direction:column;gap:12px;}
.wte-list li{display:flex;gap:11px;align-items:flex-start;}
.wte-num{width:24px;height:24px;border-radius:50%;background:var(--navy-light);color:var(--navy);font-family:'Nunito';font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.wte-id-mark{background:var(--warning);color:var(--warning-text);}
.wte-text{font-size:12px;color:var(--text);line-height:1.45;}
.wte-text b{font-family:'Nunito';font-weight:800;color:var(--navy);}
.wte-footer{font-family:'Caveat';font-weight:700;font-size:18px;color:var(--green);text-align:center;margin-top:14px;}

/* waiver */
.waiver-box{display:flex;gap:11px;align-items:flex-start;background:#f7f9fc;border:1px solid #eef1f7;border-radius:13px;padding:13px;margin-top:14px;}
.waiver-check{width:24px;height:24px;border-radius:7px;border:2px solid #c4cee0;background:#fff;cursor:pointer;flex:0 0 auto;position:relative;transition:background .15s,border-color .15s;}
.waiver-check.checked{background:var(--green);border-color:var(--green);}
.waiver-check.checked::after{content:"";position:absolute;left:7px;top:3px;width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg);}
.waiver-box span{font-size:11px;color:var(--text);line-height:1.5;}
.waiver-box strong{font-family:'Nunito';font-weight:800;color:var(--navy);}
.legal-link{color:var(--green);text-decoration:underline;cursor:pointer;}
.auth-note{font-family:'DM Sans';font-size:10px;color:var(--muted-cool);text-align:center;margin-top:11px;line-height:1.5;padding:0 6px;}

/* schedule */
.timing-block{margin-top:16px;}
.timing-label{font-family:'Nunito';font-weight:900;font-size:13px;color:var(--navy);display:flex;align-items:center;gap:6px;margin-bottom:9px;}
.timing-label svg{width:15px;height:15px;fill:none;stroke:var(--green);stroke-width:1.9;}
.timing-seg{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:11px;}
.timing-opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;
  border:1.5px solid #e4e8f0;background:#fff;border-radius:14px;padding:13px 13px 12px;cursor:pointer;
  transition:border-color .15s,background .15s,box-shadow .15s;position:relative;}
.timing-opt .to-title{font-family:'Nunito';font-weight:900;font-size:13.5px;color:var(--navy);letter-spacing:-.2px;}
.timing-opt .to-sub{font-family:'DM Sans';font-size:10.5px;color:var(--muted-cool);line-height:1.3;}
.timing-opt.selected{border-color:var(--green-bright);background:var(--green-light);box-shadow:var(--elig-sh);}
.timing-opt.selected .to-title{color:var(--green);}
.timing-opt.selected::after{content:"✓";position:absolute;top:9px;right:11px;font-family:'Nunito';font-weight:900;font-size:12px;color:var(--green);}
.sm-tabs{display:flex;gap:8px;background:#eef1f7;padding:4px;border-radius:13px;margin-bottom:11px;}
.sm-tab{flex:1;border:none;background:transparent;font-family:'Nunito';font-weight:800;font-size:12px;color:var(--navy-mid);padding:9px;border-radius:10px;cursor:pointer;transition:background .15s,color .15s;}
.sm-tab.selected{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,36,97,.12);}
.flex-windows{display:flex;flex-direction:column;gap:8px;}
.flex-window{border:1.5px solid #e4e8f0;border-radius:13px;padding:13px;font-family:'Nunito';font-weight:800;font-size:13px;color:var(--navy);cursor:pointer;text-align:center;transition:border-color .15s,background .15s;}
.flex-window.selected{border-color:var(--green-bright);background:var(--green-light);color:var(--green);}

/* calendar */
.cal{background:#fff;border:1px solid var(--border);border-radius:14px;padding:13px;}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.cal-title{font-family:'Nunito';font-weight:900;font-size:13.5px;color:var(--navy);}
.cal-nav{width:30px;height:30px;border-radius:9px;border:1.5px solid #e4e8f0;background:#fff;color:var(--navy);font-size:16px;cursor:pointer;}
.cal-nav:disabled{opacity:.3;cursor:default;}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px;}
.cal-dow span{text-align:center;font-family:'Nunito';font-weight:800;font-size:10px;color:var(--muted-cool);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-family:'Nunito';font-weight:700;font-size:12px;border-radius:9px;border:none;background:transparent;color:var(--navy);cursor:pointer;}
.cal-cell.cal-day:hover{background:var(--navy-light);}
.cal-disabled{color:#c4cee0;cursor:default;}
.cal-selected{background:linear-gradient(135deg,var(--green-bright),var(--green));color:var(--navy);font-weight:900;}
.cal-empty{cursor:default;}
.cal-time-row{display:flex;align-items:center;gap:9px;margin-top:11px;}
.cal-time-label{font-family:'Nunito';font-weight:800;font-size:12px;color:var(--navy);display:flex;align-items:center;gap:5px;}
.cal-time-label svg{width:15px;height:15px;fill:none;stroke:var(--navy);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.cal-time-select{flex:1;}
.cal-chosen{font-family:'DM Sans';font-size:11.5px;color:var(--muted-cool);margin-top:10px;text-align:center;}
.cal-chosen b{font-family:'Nunito';font-weight:800;color:var(--green);}

/* empty worker note */
.soft-note{background:#f7f9fc;border:1px dashed #d8dfeb;border-radius:14px;padding:15px;margin-top:16px;font-size:12.5px;color:var(--muted-cool);line-height:1.5;text-align:center;}
.soft-note b{font-family:'Nunito';font-weight:800;color:var(--navy);}

/* ── Submitted ── */
.burst{text-align:center;padding:18px 10px 8px;}
.check-circle{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--green-bright),var(--green));display:flex;align-items:center;justify-content:center;margin:0 auto 14px;box-shadow:0 10px 26px rgba(51,217,117,.4);animation:pop .45s cubic-bezier(.2,1.3,.4,1) both;}
@keyframes pop{from{transform:scale(.3);opacity:0;}to{transform:scale(1);opacity:1;}}
.check-circle svg{width:32px;height:32px;fill:none;stroke:var(--navy);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;}
.burst h4{font-family:'Nunito';font-weight:900;font-size:21px;color:var(--navy);letter-spacing:-.4px;}
.burst p{font-size:12.5px;color:var(--muted-cool);margin-top:5px;}
.burst p strong{color:var(--navy);font-weight:800;}
.si-band{display:flex;align-items:center;gap:11px;background:linear-gradient(135deg,var(--green-light),#d6efe0);border:1px solid #bfe6cf;border-radius:var(--radius);padding:13px;margin-top:14px;}
.si-ico{width:38px;height:38px;border-radius:11px;background:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.si-ico svg{width:21px;height:21px;fill:none;stroke:var(--green);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.si-text{flex:1;}
.si-text h5{font-family:'Nunito';font-weight:900;font-size:13px;color:var(--navy);}
.si-text p{font-size:11px;color:#3e6b52;line-height:1.35;margin-top:1px;}
.si-btn{font-family:'Nunito';font-weight:900;font-size:12px;color:var(--navy);background:linear-gradient(135deg,var(--green-bright),var(--green));border:none;border-radius:12px;padding:11px;width:100%;margin-top:13px;cursor:pointer;box-shadow:0 6px 16px rgba(51,217,117,.35);}
.matched-actions{display:flex;gap:9px;margin-top:11px;}
.ma-btn{flex:1;border-radius:13px;padding:12px;font-family:'Nunito';font-weight:900;font-size:12.5px;cursor:pointer;border:1.5px solid #e4e8f0;background:#fff;color:var(--navy);}
.ma-btn-secondary{color:var(--error);border-color:#f0d5da;}

/* ── Footer action bar ── */
.foot{flex:0 0 auto;background:#fff;border-top:1px solid var(--border);padding:13px 16px calc(13px + env(safe-area-inset-bottom));display:flex;gap:10px;}
.btn{flex:1;border:none;border-radius:14px;padding:15px 18px;font-family:'Nunito';font-weight:900;font-size:14.5px;cursor:pointer;transition:transform .1s,box-shadow .15s,opacity .15s;}
.btn:active{transform:scale(.98);}
.btn-primary{background:linear-gradient(135deg,var(--green-bright),var(--green));color:var(--ink-on-green);box-shadow:0 8px 22px rgba(51,217,117,.4);}
.btn-navy{background:var(--navy);color:#fff;}
.btn-outline{background:#fff;border:1.5px solid var(--navy);color:var(--navy);flex:0 0 auto;padding:15px 20px;}
.btn-pass{background:#f1f3f8;color:var(--navy);}
.btn.is-disabled{opacity:.5;}
.btn-schedule{flex:0 0 auto;background:#f1f3f8;color:var(--navy);padding:15px 18px;}

/* toast */
.toast{position:absolute;left:16px;right:16px;bottom:90px;background:var(--navy);color:#fff;border-radius:13px;padding:12px 14px;font-family:'Nunito';font-weight:700;font-size:12.5px;box-shadow:var(--over-sh);z-index:60;display:flex;align-items:center;gap:9px;animation:toastIn .25s ease both;}
@keyframes toastIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.toast svg{width:18px;height:18px;fill:none;stroke:var(--warning);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;}
/* age-restricted / high-importance alert toast */

.su-back{position:absolute;inset:0;z-index:120;background:rgba(0,16,42,.46);
  opacity:0;pointer-events:none;transition:opacity .22s;}
.su-back.show{opacity:1;pointer-events:auto;}
.su-sheet{position:absolute;left:0;right:0;bottom:0;z-index:121;

  box-shadow:var(--over-sh, 0 16px 40px -10px rgba(0,36,97,.3));transform:translateY(102%);transition:transform .26s cubic-bezier(.22,.9,.3,1);
  max-height:92%;display:flex;flex-direction:column;
  padding:18px 18px calc(16px + env(safe-area-inset-bottom));}
.su-sheet.show{transform:translateY(0);}
.su-grip{width:38px;height:4px;border-radius:99px;background:var(--line, #EAE3D5);margin:0 auto 12px;flex:0 0 auto;}
.su-body{overflow-y:auto;-webkit-overflow-scrolling:touch;}
.su-tag{display:inline-block;font-family:'Nunito';font-weight:900;font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--green, #1CB061);background:var(--green-tint, #E8F5EE);
  padding:4px 10px;border-radius:99px;margin-bottom:8px;}
.su-tag.ar{color:var(--warning-text, #92580D);background:#FFF3D1;}
.su-title{font-family:'Nunito';font-weight:900;font-size:19px;color:var(--navy, #002461);line-height:1.2;}
.su-sub{font-family:'DM Sans';font-size:13px;color:var(--ink-soft, #3A4D74);margin-top:5px;line-height:1.5;}
.su-sub em{color:var(--muted-cool, #6b7280);font-style:italic;}
.su-field{margin-top:14px;}
.su-field>label{display:block;font-family:'Nunito';font-weight:800;font-size:11px;
  color:var(--navy, #002461);margin-bottom:6px;}
.su-field input{width:100%;border:1.5px solid var(--line-cool, #E3E7EF);border-radius:12px;
  padding:13px 14px;font-family:'DM Sans';font-size:15px;color:var(--navy, #002461);background:#fff;
  outline:none;transition:border-color .15s;}
.su-field input:focus{border-color:var(--green-bright, #33D975);}
.su-field input::placeholder{color:#aab1bd;}
.su-row{display:flex;gap:10px;}
.su-row .su-field{flex:1 1 0;}
.su-verified{color:var(--green, #1CB061);font-weight:800;font-size:10.5px;}
.su-primary{width:100%;margin-top:16px;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--green-bright, #33D975),var(--green, #1CB061));color:var(--navy, #002461);
  font-family:'Nunito';font-weight:900;font-size:15px;border-radius:14px;padding:14px;
  box-shadow:0 4px 12px -3px rgba(28,176,97,.5);transition:transform .08s,opacity .15s;}
.su-primary:active{transform:scale(.985);}
.su-primary:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;
  background:var(--line-cool, #E3E7EF);color:var(--muted-cool, #6b7280);}
.su-link{background:none;border:none;cursor:pointer;font-family:'Nunito';font-weight:800;
  font-size:12.5px;color:var(--ink-soft, #3A4D74);padding:6px 2px;}
.su-link:hover{color:var(--navy, #002461);}
.su-hint{font-family:'DM Sans';font-size:11.5px;color:var(--muted-cool, #6b7280);margin-top:12px;line-height:1.5;}
.su-hint a{color:var(--green, #1CB061);font-weight:700;cursor:pointer;text-decoration:underline;}
.su-hint b{color:var(--ink-soft, #3A4D74);}
/* demo context switch */
.su-demo{display:flex;align-items:center;gap:10px;margin-top:14px;padding:10px 12px;
  background:var(--z-acct, #E9F1FC);border:1px dashed var(--cornflower, #BADBFC);border-radius:12px;}
.su-demo span{font-family:'DM Sans';font-size:11.5px;color:var(--ink-soft, #3A4D74);line-height:1.4;}
.su-switch{flex:0 0 auto;width:40px;height:23px;border-radius:99px;border:none;cursor:pointer;
  background:var(--line-cool, #E3E7EF);position:relative;transition:background .18s;}
.su-switch::after{content:"";position:absolute;top:2.5px;left:2.5px;width:18px;height:18px;
  border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .18s;}
.su-switch.on{background:var(--green, #1CB061);}
.su-switch.on::after{left:19.5px;}

.su-otp{display:flex;gap:8px;margin-top:16px;justify-content:space-between;}
.su-otp input{width:100%;aspect-ratio:1/1.15;text-align:center;border:1.5px solid var(--line-cool, #E3E7EF);

  background:#fff;outline:none;}

.su-ar-banner{display:flex;gap:11px;align-items:flex-start;margin-top:16px;padding:13px 14px;

// Keep an open info-popover inside the fixed phone frame. The popover is
// anchored left:0 to a tiny inline tip, so a right-edge tip (e.g. the cost
// popover) would otherwise clip off-frame. After each open we measure and
// nudge it horizontally so both edges stay within the frame (universal,
// low-risk: covers every info button, both .info-tip and .info-row anchors).
function clampOpenPopover(){
  const pop=document.querySelector('.info-tip.open .info-popover, .info-row.open .info-popover');
  if(!pop) return;
  const frame=document.querySelector('.phone');
  if(!frame) return;
  // NOTE: the open popover runs `animation:stageIn ... both`, whose final keyframe
  // sets `transform:none`. CSS animations outrank inline styles, so nudging via
  // transform is silently overridden — we shift via `left` (not animated) instead.
  pop.style.left='';                       // reset to CSS anchor (left:0) before measuring
  const fr=frame.getBoundingClientRect(), r=pop.getBoundingClientRect(), pad=10;
  let shift=0;
  if(r.right>fr.right-pad) shift=(fr.right-pad)-r.right;
  if(r.left+shift<fr.left+pad) shift=(fr.left+pad)-r.left;
  if(shift) pop.style.left=shift+'px';
}
window.addEventListener('resize', clampOpenPopover);

/* ---- Fee model (mirrors Request workbook) ---- */
const GOPHER_FEE = { delivery:0.99, ride:2.99, labor:2.99, junk:3.99, yard:3.99, moving:3.99, home:4.99, other:1.99 };
const AGE_FEE = 1.99;
const INSTANT_TRANSFER_RATE = 0.08;
const PROMO_CODES = { GOPHER50:{ label:'GOPHER50', desc:'50% off fees', feeMultiplier:0.5 } };
const getPromo = (code)=> code ? (PROMO_CODES[String(code).trim().toUpperCase()] || null) : null;

function computeRequestFee(cogOffer){
  /* GOPHER DEALS — service-provider deals are a SET PRICE: the customer pays exactly
     that and NOTHING else. Zero fees, no ITF, no promo, no TrustShield line — there is
     no fee bundle left for a discount to apply to. The 10% Deal Boost is Gopher's own
     take out of that price and is NEVER added to what the customer pays; it is carried
     for the admin log only. Ported verbatim in behaviour from the web app's
     computeRequestFee (Final/gopher-request.html), which this surface must match.
     ⚠️ Gated on dealKind === 'service', not on fromDeal — a MERCHANT deal is a normal
     priced request and must keep its full fee schedule. */
  if(state.fromDeal && state.dealKind === 'service'){
    const dealBoostFee = Math.round(cogOffer * 0.10 * 100) / 100;
    return { gopherFee:0, ageFee:0, instantTransfer:0, requestFee:0, cogOffer,
             gmvTotal:cogOffer, grossCost:cogOffer, promo:null, promoDiscount:0,
             trustShieldDiscount:0, fullGopherFee:0, fullAgeFee:0, fullInstantTransfer:0,
             dealBoostFee, serviceDealZeroFee:true };
  }
  const promo = getPromo(state.promoApplied ? state.promoCode : null);
  const promoPct = promo ? (1 - promo.feeMultiplier) : 0;          // 0.5 == "50% off" for GOPHER50
  const baseGopher = GOPHER_FEE[state.category] ?? GOPHER_FEE.other;
  const baseAge = (state.category==='delivery' && state.ageRestricted) ? AGE_FEE : 0;
  const feeSubtotal = baseGopher + baseAge;                        // platform fee, pre-ITF, undiscounted

  // Instant transfer (D-033, STANDS): 8% on the FULL undiscounted base
  // (offer + items + full platform fees) — never computed on a reduced base.
  const instantTransfer = INSTANT_TRANSFER_RATE * (cogOffer + feeSubtotal);
  const totalFees = feeSubtotal + instantTransfer;                 // the full, discountable fee bundle

  // Discounts (D-033 · canonical Discount Sheet, corrected Jun 21 2026):
  //  • a % promo applies to the WHOLE fee bundle INCLUDING the ITF
  //      promo = pct × (Gopher Fee + age fee + instant transfer)   -> GOPHER50 halves the ITF too
  //  • TrustShield is a flat $1 off the TOTAL (Delivery & Ride), applied LAST, no $0.99 floor
  //  • CAP: promo + TrustShield ≤ total fees (discounts can zero the fee bundle,
  //    but never reduce the offer/items); TS absorbs any truncation when the cap binds.
  const hasTS = (typeof window.__hasTrustShield === 'function')
    ? !!window.__hasTrustShield() : !!(state && state.trustShield);
  /* TrustShield $1 perk scope — age-restricted Delivery + ALL Ride Sharing, never plain
     delivery. Owner ruling 2026-07-05 made the NARROW build scope authoritative; this file
     carried the rejected broad scope, so the discount was applying to every delivery — a
     silent money leak with no visible error, which is why it survived. Request and Connect
     were both already correct. */
  const tsEligible = hasTS && ((state.category==='delivery' && state.ageRestricted) || state.category==='ride');
  const promoDiscount = Math.min(promoPct * totalFees, totalFees);
  const tsDiscount    = tsEligible ? Math.min(1.00, totalFees - promoDiscount) : 0;

  const grossCost = cogOffer + totalFees;                          // pre-discount subtotal (Offer + items + fees)
  const gmvTotal  = grossCost - promoDiscount - tsDiscount;        // Total Cost
  const requestFee = gmvTotal - cogOffer;                          // net fee shown on the review line (rows sum to Total)

  // Receipt "list price" lines (pre-discount); discounts render as their own rows.
  const fullGopherFee = baseGopher, fullAgeFee = baseAge;
  const fullInstantTransfer = instantTransfer;
  // Net per-line allocation (kept consistent for any itemized net view).
  const _net = totalFees > 0 ? ((totalFees - promoDiscount - tsDiscount) / totalFees) : 0;
  const gopherFee = baseGopher * _net;
  const ageFee = baseAge * _net;

  return { gopherFee, ageFee, instantTransfer, requestFee, cogOffer, gmvTotal, promo,
           promoDiscount, trustShieldDiscount: tsDiscount,
           fullGopherFee, fullAgeFee, fullInstantTransfer, grossCost };
}

const RIDE_RATES = { fee: GOPHER_FEE.ride, perMin: 0.55, itf: INSTANT_TRANSFER_RATE, minRide: 8.00, band: 0.25, schedUplift: 0.15 };
const RIDE_MILE_TIERS = [ [0,5,2.40], [5,15,1.80], [15,40,1.35], [40,Infinity,1.05] ];
function rideMileageCost(miles){ let c=0; for(const [lo,hi,rate] of RIDE_MILE_TIERS){ c += Math.max(0, Math.min(miles,hi)-lo)*rate; } return c; }

  const r=RIDE_RATES;

  const calc=(mult)=>{ let base=Math.max(r.fee+variable*mult, r.minRide); if(scheduled) base*=(1+r.schedUplift); return base*(1+r.itf); };
  return { low:Math.round(calc(1-r.band)), suggested:Math.round(calc(1)), generous:Math.round(calc(1+r.band)), miles, minutes };
}

function customerAgeYears(){

  let y,m,d;
  let mm=raw.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(mm){ y=+mm[1]; m=+mm[2]; d=+mm[3]; }

function idOnFileOrSubmitted(){ return !!(state.savedOnFile || state.idSubmittedAt || idVerifiedNow()); }

/* ============================================================
   HELPERS
   ============================================================ */
const $ = (s,r)=> (r||document).querySelector(s);
const toNum = (v)=> parseFloat(String(v).replace(/[^0-9.]/g,'')) || 0;
const fmt = (n)=> '$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc = (s)=> String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const STEP_TITLES = ['Pick a service','Job details','Worker info','Locations','Worker pay','Review','Submitted'];

function workerCount(){ return state.moreThanOneWorker ? (parseInt(state.numWorkers,10)||1) : 1; }
function perWorkerPay(){ const r=toNum(state.payAmount); return state.payByHour ? r*(parseInt(state.numHours,10)||1) : r; }
function workerPayTotal(){ return perWorkerPay()*workerCount(); }
// Bids stay available for >1-worker requests — the single bidder is responsible for paying the WHOLE
// crew, so one bid covers every worker (no discrepancy). Bids are hidden only by category (bidsOption
// matrix) and, for Labor/Yard, when paying by the hour. NOTE: NOT gated by moreThanOneWorker.
function bidsAllowed(){ return isVisible('bidsOption') && !(state.payByHour && (state.category==='labor'||state.category==='yard')); }
// "Low offer" floor — only meaningful where Gopher iQ pricing exists
// (Delivery + Ride + Junk volume tiers). Other categories have no
// suggested-pricing model, so we never show a low-offer caution for them.
function offerLowThreshold(){
  if(state.category==='delivery' || state.category==='ride' || state.category==='junk'){ const m=getCurrentOfferModel(); return m ? m.low : 0; }
  return 0;
}
function cogOfferNow(){
  const costItems = (state.itemsPurchased && state.category==='delivery') ? toNum(state.costOfItems) : 0;
  return costItems + workerPayTotal();
}

function arIdentityControl(){
  if(state.trustShield) return `<div class="ts-verified">${tsSeal(18)}TrustShield™ Verified — ID on file, nothing to submit for this order.</div>`;
  /* ⛔ NO AGE BRANCH (owner ruling, 2026-08-25: "there is no distinction with ANY age.
     ALL users need to submit their identification"). Modelled on the web change in
     036bc2d, which removed the same fork from Request and Connect.

     the two outcomes differ only in HOW LONG the identity lasts:

     nobody under 21 can order age-restricted at all — enforced on the deal categories,

  if(idOnFileOrSubmitted()) return `<div class="ar-id-done">

}

      ${''/* ⛔ HIDDEN IN HOURLY MODE (owner, 2026-08-26 — web parity, 0a249c7): the iQ
           model returns a whole-job range, which is not a per-hour rate. Offering it
           beside an hourly field invites the requester to paste a job total into a
           rate box. Same reason the low-offer notice above is skipped. */}
