// Full-screen Gopher iQ offer modal (built + appended to #phone, not inline)
function offerModalHTML(){
  const model = getCurrentOfferModel() || suggestedOffer(currentItemCost(), currentRegionIsNC());
  const isRide = state.category==='ride';
  const half = Math.max(model.suggested-model.low, model.generous-model.suggested, 1)*1.6;
  const trackMin = Math.max(0, Math.round(model.suggested-half));
  const trackMax = Math.round(model.suggested+half);
  const offerToPct=(v)=> trackMax===trackMin?50:Math.max(0,Math.min(100,Math.round((v-trackMin)/(trackMax-trackMin)*100)));
  const tripPill = (isRide && model.miles!=null) ? `<div class="os-trip">Estimated trip: ~${Math.round(model.miles*10)/10} mi · ~${Math.round(model.minutes)} min <span class="os-trip-est">(estimate — live distance once your maps are connected)</span></div>` : '';
  // Junk volume-tier selector (owner 2026-07-19): iQ pre-selects the detected tier;
  // tapping a button corrects it, and the modal re-renders with the slider re-ranged
  // to that tier's band (this file's re-render = the web's applyModel(m) refactor).
  const L=window.GopherRequestLogic;
  const tierRow = (state.category==='junk' && L && L.JUNK_TIER_ORDER) ? `<div class="os-junk-tiers" role="group" aria-label="How much are we hauling?">`
      + L.JUNK_TIER_ORDER.map(tk=>{ const t=L.JUNK_TIERS[tk], on=tk===currentJunkTier();
        return `<button type="button" class="os-tier${on?' active':''}" data-action="junk-tier" data-tier="${tk}" aria-pressed="${on}"><span class="os-tier-name">${t.label}</span><span class="os-tier-hint">${t.hint}</span></button>`; }).join('')
      + `</div>` : '';
  return `<div class="offer-backdrop" data-action="ai-pay-cancel"></div>
    <div class="offer-card" role="dialog" aria-modal="true" data-tmin="${trackMin}" data-tmax="${trackMax}" data-low="${model.low}" data-sug="${model.suggested}" data-gen="${model.generous}">
      <div class="os-panel-head"><img class="os-logo" src="${GOPHER_IQ_SRC}" alt="Gopher iQ"><span>Suggested fair offer</span></div>
      ${tripPill}${tierRow}
      <div class="os-slider-wrap">
        <div class="os-rail-labels"><span class="os-lab-low">Low</span><span class="os-lab-fair">Fair</span><span class="os-lab-gen">Generous</span></div>
        <input type="range" class="os-slider" id="offerSlider" min="0" max="100" value="${offerToPct(model.suggested)}" aria-label="Offer amount">
        <div class="os-rail-vals"><span id="osLowVal">$${model.low}</span><span class="os-rail-dash">—</span><span id="osGenVal">$${model.generous}</span></div>
      </div>
      <div class="os-amount-block">
        <div class="os-amount-label">Your offer</div>
        <div class="os-amount-input-box"><span class="os-amount-currency">$</span><input class="os-amount-input" id="offerAmountInput" inputmode="decimal" value="${model.suggested}" aria-label="Offer to worker"></div>
        <div class="os-hint" id="osHint">Drag the slider either direction for an offer that works for you, or simply enter your offer</div>
      </div>
      <div class="os-actions">
        <button class="os-cancel" data-action="ai-pay-cancel">Cancel</button>
        <button class="os-use" data-action="ai-pay-use">Use this offer</button>
      </div>
    </div>`;
}
// Create/refresh or tear down the offer modal based on state
function syncOfferModal(){
  let m=$('#offerModal');
  if(state.osOpen && state.step===5){
    if(!m){ m=document.createElement('div'); m.id='offerModal'; m.className='offer-modal'; $('#phone').appendChild(m); }
    m.innerHTML = offerModalHTML();
    bindOfferSlider();
  } else if(m){ m.remove(); }
}
function bindOfferSlider(){
  const slider=$('#offerSlider'); if(!slider) return;
  const card=slider.closest('.offer-card');
  const tmin=+card.dataset.tmin, tmax=+card.dataset.tmax;
  const low=+card.dataset.low, sug=+card.dataset.sug, gen=+card.dataset.gen;
  const amt=$('#offerAmountInput'), hint=$('#osHint');
  const STAND='Drag the slider either direction for an offer that works for you, or simply enter your offer';
  const pctToOffer=(p)=> Math.round(tmin+(p/100)*(tmax-tmin));
  const offerToPct=(v)=> tmax===tmin?50:Math.max(0,Math.min(100,Math.round((v-tmin)/(tmax-tmin)*100)));
  const updateHint=(v)=>{ hint.classList.remove('warn','over');
    if(v>gen){ hint.classList.add('over'); hint.textContent='Above suggested — faster acceptance likely'; }
    else if(v<low){ hint.classList.add('warn'); hint.textContent='Below suggested — may take longer to match'; }
    else if(v===sug){ hint.textContent='$'+v+' suggested (fair)'; }
    else{ hint.textContent='Within the suggested range'; } };
  slider.addEventListener('input',()=>{ const v=pctToOffer(+slider.value); amt.value=v; updateHint(v); });
  amt.addEventListener('input',()=>{ let raw=amt.value.replace(/[^0-9.]/g,''); const dot=raw.indexOf('.');
    if(dot!==-1) raw=raw.slice(0,dot+1)+raw.slice(dot+1).replace(/\./g,''); if(raw!==amt.value) amt.value=raw;
    if(raw===''){ hint.classList.remove('warn','over'); hint.textContent=STAND; return; }
    const v=parseFloat(raw)||0; slider.value=offerToPct(v); updateHint(Math.round(v)); });
}

/* ============================================================
   CALENDAR
   ============================================================ */
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW=['S','M','T','W','T','F','S'];
const TIME_SLOTS=(()=>{const o=[];for(let h=6;h<=21;h++){const ap=h<12?'AM':'PM';const h12=((h+11)%12)+1;o.push(`${h12}:00 ${ap}`);if(h!==21)o.push(`${h12}:30 ${ap}`);}return o;})();
function isoToDate(iso){if(!iso)return null;const[y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d);}
function dateToISO(dt){return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;}
function todayMid(){const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());}
function firstBookableISO(){const t=todayMid();t.setDate(t.getDate()+1);return dateToISO(t);}
function schedLabel(){
  if(!state.schedDate) return 'Select a day';
  const d=isoToDate(state.schedDate);
  return `${MONTHS[d.getMonth()].slice(0,3)} ${d.getDate()} · ${state.timeSlot}`;
}
function renderCalendar(){
  if(!state.calViewISO){ const f=isoToDate(firstBookableISO()); state.calViewISO=dateToISO(new Date(f.getFullYear(),f.getMonth(),1)); }
  const view=isoToDate(state.calViewISO), vY=view.getFullYear(), vM=view.getMonth();
  const firstDow=new Date(vY,vM,1).getDay(), days=new Date(vY,vM+1,0).getDate();
  const minDate=isoToDate(firstBookableISO());
  const canPrev=new Date(vY,vM,0)>=minDate;
  let cells='';
  for(let i=0;i<firstDow;i++) cells+='<span class="cal-cell cal-empty"></span>';
  for(let d=1;d<=days;d++){const cd=new Date(vY,vM,d),iso=dateToISO(cd);
    const dis=cd<minDate, sel=iso===state.schedDate;
    const cls=['cal-cell','cal-day',dis?'cal-disabled':'',sel?'cal-selected':''].filter(Boolean).join(' ');
    cells+= dis ? `<span class="${cls}">${d}</span>` : `<button type="button" class="${cls}" data-cal-day="${iso}">${d}</button>`;
  }
  return `<div class="cal">
    <div class="cal-head">
      <button class="cal-nav" data-cal-nav="prev" ${canPrev?'':'disabled'}>‹</button>
      <div class="cal-title">${MONTHS[vM]} ${vY}</div>
      <button class="cal-nav" data-cal-nav="next">›</button>
    </div>
    <div class="cal-dow">${DOW.map(d=>`<span>${d}</span>`).join('')}</div>
    <div class="cal-grid">${cells}</div>
    <div class="cal-time-row"><label class="cal-time-label">${svgIco('clock')} Time</label>
      <select class="cal-time-select field-select" id="schedTime">${TIME_SLOTS.map(t=>`<option ${t===state.timeSlot?'selected':''}>${t}</option>`).join('')}</select></div>
    <div class="cal-chosen">Scheduled for <b>${schedLabel()}</b></div>
  </div>`;
}

function workerPayTip(bids,wCount,perW,wPay){
  if(bids) return '';
  const open=state.openInfo==='wpay';
  const rate=toNum(state.payAmount), hours=parseInt(state.numHours,10)||1;
  const item=(l,v)=>`<div class="fee-item"><span>${l}</span><span>${v}</span></div>`;
  let body='';
  if(state.payByHour){
    body+=item('Rate', '$'+rate.toFixed(2)+'/hr');

    body+=item('Per worker', fmt(perW));
  } else {
    body+=item('Per worker', fmt(perW));

/* Typewriter for the submitted screen's "Looking for your worker…" — the line keeps re-typing
   itself (L, Lo, Loo, …) so the requester can SEE that matching is actively running. The typed
   text overlays an invisible full-width copy, so the "· Order #…" tail never shifts. Progress
   lives on the element, so a re-render simply restarts the loop; the interval is a no-op when
   no [data-typetext] element is on screen. */
(function initTypewriter(){
  setInterval(function(){
    document.querySelectorAll('[data-typetext]').forEach(function(el){
      var full=el.getAttribute('data-typetext')||'';
      if(el._hold>0){ el._hold--; if(el._hold===0) el._i=0; return; }   // full line rests, then re-types
      el._i=(el._i==null)?1:el._i+1;
      if(el._i>=full.length){ el.textContent=full; el._hold=16; }
      else el.textContent=full.slice(0,el._i)+'▏';
    });
  },100);
})();

function stepGate(){
  if(state.step===1 && !state.category) return {ok:false,sel:'.cat-grid',msg:'Pick a service category to continue.'};
  if(state.step===2 && isVisible('describe') && !state.description.trim()) return {ok:false,sel:'#descriptionInput',msg:'Add a description before continuing.'};
  if(state.step===2 && state.itemsPurchased && !(toNum(state.costOfItems)>0)) return {ok:false,sel:'#costOfItemsInput',msg:'Enter the cost of items before continuing.'};
  if(state.step===2 && !state.ageRestricted && !state.ageKeywordAck && findAgeRestrictedKeyword(state.description))
    return {ok:false,sel:'.age-kw-banner',msg:'This looks age-restricted — confirm before continuing.',tone:'alert',age:true};   // ALL categories (compliance): age items under Other/Ride/etc. can't bypass the ID/waiver flow
  /* ⛔⛔ THE IDENTITY GATE IS BACK (owner ruling, 2026-08-25) — this SUPERSEDES the
     G40-410 removal that stood here on 2026-08-24; that note is kept below rather than
     deleted, so the reversal stays legible instead of looking like the gate was never
     touched. Modelled on the web change in 036bc2d.
     G40-410 removed it for exactly one reason: iDenfy was being retired, enrolment
     would stop, and under-30 (who then had no one-off ID path) would have been left
     unable to order at all. TrustShield now runs INTERNALLY — enrolment never stops —
     so the reason is gone and the requirement returns, for EVERYONE, no age branch.
     ⚠️ SCOPE IS NARROW and this condition is what carries it: delivery + ageRestricted
     only. A normal order is never gated by this.
     ⚠️ Satisfied by EITHER path — that is the point: a one-time submission
     (idSubmittedAt) or the persistent badge (trustShield / savedOnFile).
     Superseded: "G40-410 (owner, 2026-08-24): TrustShield ID gate REMOVED —
     verification is voluntary. Surface 2 of 3; web surfaces cleared in 77b4617." */
  if(state.step===2 && state.category==='delivery' && state.ageRestricted && !identitySatisfied())
    return {ok:false,sel:'.ar-control',msg:'Submit your identification for this age-restricted order to continue.',tone:'alert'};
  /* Step 4 LOCATIONS — added 2026-08-25 (owner: align the prototype with Request web + Connect).
     This step had NO gate at all: a requester could leave BOTH address fields blank, walk past
     "Locations", and reach Review with the destination rendering as an em-dash. Both web surfaces
     have gated this since the shared module landed, and gopher-step-gates.js ALREADY modelled the
     prototype as having these two gates — the model was right and the code was the outlier. Proven
     by executing this stepGate() against GopherStepGates.evaluate(..., 'prototype'), not by reading.
     Semantics MIRROR the module's pickupAddress/dropoffAddress gates deliberately, including the
     firstEmpty() array walk (this UI renders one stop, but state is array-shaped for web parity)
     and the pick-up-reports-first ordering, which the sequential ifs below give for free.
     ⚠️ The `isVisible('pickupSection')` guard is copied from the module and carries a KNOWN HOLE
     with it: the five categories that hide the pick-up section (home, labor, junk, yard, other)
     still RENDER a Destination input that nothing validates — on all three surfaces, live on web.
     Reproduced here on purpose so "aligned with web" is literally true; raised with the owner as a
     cross-surface defect. The fix is one clause in the module's dropoffAddress.when — when it
     lands, this needs the same change (or this surface adopts the module outright). */
  if(state.step===4 && !state.noSpecificPickup && isVisible('pickupSection') && firstEmptyStop(state.pickupStops)>-1)
    return {ok:false,sel:'input[data-field="pickupStops"]',msg:'Add a pick-up address so your Gopher knows where to start.'};
  if(state.step===4 && !state.noSpecificPickup && isVisible('pickupSection') && firstEmptyStop(state.dropoffStops)>-1)
    return {ok:false,sel:'input[data-field="dropoffStops"]',msg:'Add a drop-off address so your Gopher knows where to go.'};
  /* ADDRESSES MUST DIFFER — added 2026-08-25 (owner: model Connect and Request, which
     are live and correct). Mirrors the shared module's addressesDiffer gate, including
     its step list: 4 AND 6. Step 6 is not redundant — a step gate only sees the CURRENT
     step, so a pair edited back to identical after leaving Locations would otherwise
     reach submit unchecked. Comparison is normalised the same way the module does it
     (lowercase, strip everything non-alphanumeric), so "218 Fayetteville St." and
     "218 fayetteville st" are correctly the same address. */
  if((state.step===4 || state.step===6) && !state.noSpecificPickup && isVisible('pickupSection')
     && Array.isArray(state.pickupStops) && Array.isArray(state.dropoffStops)){
    const pk=state.pickupStops.map(normAddr).filter(Boolean);
    const dp=state.dropoffStops.map(normAddr).filter(Boolean);
    /* `id` is carried so goNext() can swap this one gate's field-flash for the
       pickupSameAsDropoff modal — the same additive move web made in toWebShape().
       ⚠️ Without it the modal wiring is a SILENT NO-OP: g.id is undefined, the
       comparison is simply false, nothing throws, and the generic flash keeps
       showing as if nothing were wired. The other gates carry no id because
       nothing consumes one yet; add one when something does. */
    if(pk.some(a=>dp.indexOf(a)!==-1))
      return {ok:false,id:'addressesDiffer',sel:'input[data-field="dropoffStops"]',msg:'Your pick-up and drop-off need to be different addresses — please update one so your Gopher knows where to go.'};
  }
  // A worker must ALWAYS be offered > $0 (owner, 2026-07-17). The only path with no set
  // offer is a REAL bids job (payMode 'bids' AND the category allows bids) — anything else
  // needs a positive amount. Checked at the pay step AND re-checked at submit as a backstop
  // (stepGate only sees the current step, so a stale $0 could otherwise slip through review).
  if(state.step===5 && !(state.payMode==='bids' && bidsAllowed()) && !(toNum(state.payAmount)>0)) return {ok:false,sel:'#payAmountInput',msg:'Enter how much you\'d like to pay your worker.'};
  if(state.step===6 && !(state.payMode==='bids' && bidsAllowed()) && !(perWorkerPay()>0))
    return {ok:false,sel:null,msg:'Your worker\'s pay can\'t be $0 — go back to Worker pay and set an offer.',tone:'alert'};
  /* SCHEDULED REQUESTS NEED A TIME — added 2026-08-25, mirroring the module's
     scheduleTime gate. Sits BEFORE the waiver deliberately: that ordering is a decision
     on the web surfaces (a missing time is an upstream data fault, the waiver is a
     deliberate action), and modelling their flow means modelling the order too.
     ⚠️ Mostly a BACKSTOP here: this surface's timeSlot defaults to '2:00 PM' and its
     picker is a <select> that always has a selection, so a user cannot normally empty
     it. A restored draft or a programmatic set can, which is exactly when a silent
     submit with no time would otherwise get through. */
  if(state.step===6 && state.scheduleType==='scheduled' && !state.timeSlot)
    return {ok:false,sel:'#schedTime',msg:'Pick a time for your scheduled request.'};
  if(state.step===6 && !state.waiverChecked) return {ok:false,sel:'.waiver-box',msg:'Check the liability waiver before submitting.'};
  return {ok:true};
}

function flashGate(gate){
  if(!gate.sel) return;
  const content=$('#content');
  if(content){ content.querySelectorAll('.field-invalid').forEach(e=>e.classList.remove('field-invalid')); }
  const el=$(gate.sel,content);
  if(el){
    const pill=(el.matches('input,textarea,select') && el.closest('.sub-field')) || el;
    pill.classList.remove('field-invalid'); void pill.offsetWidth; pill.classList.add('field-invalid');
    pill.scrollIntoView({behavior:'smooth',block:'center'});
    const focusable=el.matches('input,textarea,select')?el:$('input,textarea,select',el);
    if(focusable){ try{focusable.focus({preventScroll:true});}catch(e){} }
  }

function goNext(){
  const g=stepGate();
  if(!g.ok){
    if(g.age){ openAgeKwModal(); return; }
    /* G40 modal: pickupSameAsDropoff (web parity, 76a3b9c). The addressesDiffer gate
       ALREADY hard-blocks identical ends — this swaps its generic field-flash for the
       purpose-built modal, which names the two sliders that resolve it. The gate still
       blocks every time until the addresses differ: presentation, not policy. */
    if(g.id==='addressesDiffer' && window.G40_REQ){ G40_REQ.pickupSameAsDropoff(); return; }
    showToast(g.msg,g.tone); flashGate(g); return; }
  /* ── Phone-number privacy gate (G40 modal: phoneEntered) ──────────────────
     Phone numbers are never broadcast; in-app text/call exists after submit. HARD
     block with NO ack flag — that is the rule the modal states, so an "I know"
     escape hatch would contradict it. Ordered AFTER the age-keyword gate and BEFORE
     the category nudge, matching web exactly; compliance outranks privacy outranks
     a suggestion. Fails open if the modal library is missing, matching the
     age-keyword precedent — never trap the user behind a dead modal. */
  if(state.step===2 && window.G40_REQ
     && /(\+?1[\s.\-]?)?\(?\d{3}\)?[\s.\-]?\d{3}[\s.\-]?\d{4}\b/.test(String(state.description||''))){
    G40_REQ.phoneEntered(); return;
  }
  // Category-mismatch nudge (worker visibility) — after the age gate (precedence).
  if(state.step===2 && !findAgeRestrictedKeyword(state.description) && window.__checkCategoryMismatch && window.__checkCategoryMismatch()) return;
  // ── Age-restricted "no purchase" guardrail (owner 2026-08-18, web parity) ──
    // Age-restricted auto-enables "purchase needed"; if the user turned it back OFF,
    // warn once before advancing (edge cases: Rx pickup, pre-paid alcohol). Fires at
    // this single choke point, not on the toggle, so mid-edit flips never nag.
    if(state.step===2 && state.category==='delivery' && state.ageRestricted
       && !state.itemsPurchased && !state.agePurchaseAck && !state.agePurchaseDismissed){
      openAgePurchaseModal(); return;
    }
    state.openCatInfo=null;
  if(state.step<6){ state.step=nextVisibleStep(state.step); if(state.step>state.maxStepReached)state.maxStepReached=state.step; render(); }
}

function goBack(){ if(state.step>1){ state.openCatInfo=null; state.step=prevVisibleStep(state.step); render(); } else if(state.demo){ gotoURL('signin'); } }

function submitRequest(){
  const g=stepGate();
  if(!g.ok){ showToast(g.msg,g.tone); flashGate(g); return; }
  state.step=7; state.maxStepReached=7;
  if(state._stashed && state._stashedOrder && window.GReq){
    // Edited & resubmitted — UPDATE the existing request and bump resubmitSeq so the harness
    // re-injects it and the worker gets a fresh "request updated" notification.
    var upd=buildPending(); upd.order=state._stashedOrder;
    var prev=GReq.get(state._stashedOrder);
    upd.resubmitSeq=((prev&&prev.resubmitSeq)||0)+1;
    upd.stage='searching'; upd.attention=null; upd.accepted=0;
    GReq.update(state._stashedOrder, upd);
  } else {
    stashPending();
  }
  render();
}

/* ============================================================
   FIELD INPUT BINDINGS (text/select that need live value capture)
   ============================================================ */
function bindFieldInputs(){
  const MONEY_FIELDS={payAmount:1,costOfItems:1};
  // Canonical location fields are ARRAYS; this single-stop UI writes element 0.
  const ARRAY_FIELDS={pickupStops:1,dropoffStops:1};
  document.querySelectorAll('[data-field]').forEach(el=>{
    const key=el.dataset.field;
    el.addEventListener('input',()=>{
      // Cost fields accept digits and a single decimal point only — never letters or symbols.
      if(MONEY_FIELDS[key]){
        let raw=el.value.replace(/[^0-9.]/g,'');
        const dot=raw.indexOf('.');
        if(dot!==-1) raw=raw.slice(0,dot+1)+raw.slice(dot+1).replace(/\./g,'');
        if(raw!==el.value) el.value=raw;
      }
      state[key]=ARRAY_FIELDS[key]?[el.value]:el.value;
      { const good=MONEY_FIELDS[key]?(toNum(el.value)>0):!!el.value.trim(); if(good){ const host=el.closest('.sub-field')||el; host.classList.remove('field-invalid'); el.classList.remove('field-invalid'); } }
      // re-arm the age-restricted backstop AND the category nudge when the description changes
      if(key==='description'){ state.ageKeywordAck=false; state.idRequiredAtCompletion=false; state.userAcknowledgedCategory=false; }

        <div class="idc-hint">Verifying an age-restricted order needs a live photo, and we couldn't find a camera on this device. Please finish in the Gopher Request mobile app — it only takes a minute, and every phone has a camera built in.</div>
      </div>
      <div class="idc-actions"><button class="idc-btn" data-idc="close">Close</button></div>`;
    if(step==='Done') return `<div class="idc-done-msg"><div class="idc-done-ico">✅</div>
        <h5>${isTS?'TrustShield™ added':'Identification submitted'}</h5>
        <div class="idc-hint">${isTS
          ? 'Your ID and selfie are on file. Every qualified order from now on skips this step — and saves you $1.'
          : 'You\'re pre-cleared for this order. Remember to bring your physical ID to the hand-off.'}</div>
      </div>
      <div class="idc-actions"><button class="idc-btn" data-idc="close">Back to my request</button></div>`;
    if(step==='Cam'){
      const selfie=camTarget==='selfie';
      return `<h5>${selfie?'Take your selfie':(camTarget==='idback'?'Photograph the BACK of your ID':'Photograph the FRONT of your ID')}</h5>
        <div class="idc-hint" id="idcCamHint">Starting camera…</div>
        <div class="idc-camwrap">
          <video id="idcVideo" class="${selfie?'mirror':''}" autoplay playsinline muted></video>
          <div class="idc-guide ${selfie?'face':''}" aria-hidden="true">
            <div class="idc-guide-win"><span></span><span></span><span></span><span></span></div>
          </div>
        </div>
        <canvas id="idcCanvas" hidden></canvas>
        <div class="idc-actions">
          <button class="idc-btn" id="idcShoot" data-idc="shoot" disabled>Capture</button>
          <button class="idc-btn sec" data-idc="cam-cancel">Cancel</button>
        </div>`;
    }
    if(step==='A') return `<h5>Front of your ID</h5>
      <div class="idc-hint">Take a live photo of the front of a valid government ID. Uploads aren't accepted — the photo has to be taken here.</div>
      <button class="idc-cap" data-idc="take-front"><span class="idc-cap-ico">📷</span>Take photo</button>
      ${err('front')}${thumb('front','Looks good? Continue to the back.')}
      <div class="idc-actions"><button class="idc-btn" data-idc="to-back" ${has('front')?'':'disabled'}>Continue</button></div>`;
    if(step==='Bk') return `<h5>Back of your ID</h5>
      <div class="idc-hint">Now the back, taken live as well. The barcode there is what lets us confirm the date of birth on the ID.</div>
      <button class="idc-cap" data-idc="take-back"><span class="idc-cap-ico">📷</span>Take photo</button>
      ${err('back')}${thumb('back','Looks good? Continue to the selfie.')}
      <div class="idc-actions">
        <button class="idc-btn" data-idc="to-selfie" ${has('back')?'':'disabled'}>Continue</button>
        <button class="idc-btn sec" data-idc="to-front">Back</button>
      </div>`;
    // step B — selfie
    return `<h5>Quick selfie</h5>
      <div class="idc-hint">Take a live selfie so we can match it to your ID. A live photo is required — upload isn't available for the selfie.</div>
      <button class="idc-cap" data-idc="take-selfie"><span class="idc-cap-ico">🤳</span>Take selfie</button>
      ${err('selfie')}${thumb('selfie','Ready to submit.')}
      <div class="idc-actions">
        <button class="idc-btn" data-idc="submit" ${idCaptureComplete()?'':'disabled'}>${isTS?'Add TrustShield™':'Submit identification'}</button>
        <button class="idc-btn sec" data-idc="to-back">Back</button>
      </div>
      <div class="idc-note">Submitting here is pre-clearance only. A valid physical ID is still required in person before the order is handed over.</div>`;
  }
  function paint(){
    const chrome = (step==='Done'||step==='NoCam'||step==='Checking') ? '' : chips();
    body.innerHTML=`<div class="idc-title">${isTS?'Add TrustShield™':'Submit identification'}</div>
      <div class="idc-sub">${isTS
        ? 'Verify once and carry the badge — every qualified order after this skips the ID step and saves you $1.'
        : 'Verify your identity for this age-restricted order. You\'ll still show a physical ID in person at hand-off.'}</div>
      ${chrome}<div class="idc-step on">${view()}</div>`;
    if(step==='NoCam') hydrateStores();
  }
  function go(next){ step=next; paint(); }

  /* ⚠️ These are LINKS, not decoration. The no-camera screen is a DEAD END by design —
     the store buttons are the only way out of it — so a badge that renders but does
     nothing strands the requester exactly where they have no other option.
     Two bugs lived here on 2026-08-25 and one hid the other: the filenames were wrong
     (app-store-badge.svg / google-play-badge.png do not exist; the real assets are
     badge-app-store.webp / badge-google-play.webp) AND an onerror handler set
     display:none, so the broken images vanished silently and the screen simply showed
     no way forward. No console error, nothing missing on screen to notice — the
     failure erased its own evidence. onerror is gone; a broken badge must now be
     visible so it gets fixed.
     Store URLs match the web app's; the Play id is io.gophergoapp.requester — the
     io.gophergo.* listings are dead packages Google removed. */
  const APP_STORE_URL='https://apps.apple.com/us/app/gopher-request/id1438150218';
  const PLAY_STORE_URL='https://play.google.com/store/apps/details?id=io.gophergoapp.requester';
  function hydrateStores(){
    const wrap=document.createElement('div'); wrap.className='idc-stores';
    wrap.innerHTML=`<a href="${APP_STORE_URL}" target="_blank" rel="noopener" aria-label="Download Gopher Request on the App Store"><img src="../../assets/img/badge-app-store.webp" alt="Download on the App Store"></a>
                    <a href="${PLAY_STORE_URL}" target="_blank" rel="noopener" aria-label="Get Gopher Request on Google Play"><img src="../../assets/img/badge-google-play.webp" alt="Get it on Google Play"></a>`;
    const msg=body.querySelector('.idc-done-msg'); if(msg) msg.after(wrap);
  }

  /* ── camera ── */
  function stopCam(){
    if(camPoll){ clearInterval(camPoll); camPoll=null; }
    if(camStream){ try{ camStream.getTracks().forEach(t=>t.stop()); }catch(e){} camStream=null; }
    const v=document.getElementById('idcVideo');
    if(v){ try{ v.pause(); }catch(e){} v.onloadedmetadata=v.onloadeddata=v.oncanplay=null; v.srcObject=null; }
  }
  function videoLive(){ const v=document.getElementById('idcVideo');
    return !!(v && v.videoWidth>0 && v.videoHeight>0 && v.readyState>=2); }
  async function cameraExists(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) return false;
    try{ if(navigator.mediaDevices.enumerateDevices){
      const d=await navigator.mediaDevices.enumerateDevices(); return d.some(x=>x.kind==='videoinput'); } }catch(e){}
    return true;   // present but unenumerable — let the live attempt decide
  }
  const KEY={idfront:'front', idback:'back', selfie:'selfie'};
  const STEP={idfront:'A', idback:'Bk', selfie:'B'};
  async function openCamera(target){
    camTarget=target; camReturn=STEP[target]; errs[KEY[target]]='';
    go('Cam');
    const hint=document.getElementById('idcCamHint');
    const shootBtn=document.getElementById('idcShoot');
    const ready=()=>{ if(shootBtn) shootBtn.disabled=false;
      if(hint) hint.textContent = target==='selfie'
        ? 'Center your face in the oval, then capture.'
        : target==='idback'
          ? 'Line the BACK of your ID up inside the frame — hold it flat and horizontal so the barcode is readable.'
          : 'Line the FRONT of your ID up inside the frame — hold it flat and horizontal, edges inside the corners.'; };
    const fail=(msg)=>{ stopCam(); errs[KEY[target]]=msg; go(STEP[target]); };
    try{
      camStream=await navigator.mediaDevices.getUserMedia({
        video:{ facingMode: target==='selfie'?'user':'environment' }, audio:false });
      const v=document.getElementById('idcVideo');
      if(v){
        v.srcObject=camStream;
        const tryReady=()=>{ if(videoLive()){ if(camPoll){clearInterval(camPoll);camPoll=null;} ready(); return true; } return false; };
        v.onloadedmetadata=tryReady; v.onloadeddata=tryReady; v.oncanplay=tryReady;
        await v.play().catch(()=>{});
        /* Some browsers fire those events inconsistently — poll for the first real
           frame, and treat ~4s of nothing as a camera that opened but yields nothing
           (covered lens, or in use by another app). */
        let tries=0;
        camPoll=setInterval(()=>{ tries++;
          if(tryReady()) return;
          if(tries>=40){ clearInterval(camPoll); camPoll=null;
            if(!videoLive()) fail('We couldn’t get a picture from your camera (it may be blocked or in use). Please check it and try again — or finish in the mobile app.'); }
        },100);
      }
    }catch(e){
      const n=e&&e.name;
      stopCam();
      if(n==='NotFoundError'||n==='OverconstrainedError'||n==='DevicesNotFoundError'){ go('NoCam'); }
      else fail('We couldn’t access the camera. Please allow camera access and try again — or finish in the mobile app.');
    }
  }
  function shoot(){
    const v=document.getElementById('idcVideo'), c=document.getElementById('idcCanvas');
    if(!v||!c||!camStream) return;
    if(!videoLive()){ errs[KEY[camTarget]]='Camera is still starting — give it a moment, then capture.'; go(STEP[camTarget]); return; }
    const w=v.videoWidth, h=v.videoHeight;
    c.width=w; c.height=h;
    const ctx=c.getContext('2d');
    if(camTarget==='selfie'){ ctx.translate(w,0); ctx.scale(-1,1); }   // un-mirror
    ctx.drawImage(v,0,0,w,h);
    let url=''; try{ url=c.toDataURL('image/jpeg',0.85); }catch(e){ url=''; }
    const t=camTarget, backTo=STEP[t];
    stopCam();
    if(!url){ errs[KEY[t]]='Capture failed — please try again.'; go(backTo); return; }
    setShot(KEY[t],url);
    go(backTo);
  }

  sheet.addEventListener('click',e=>{
    const b=e.target.closest('[data-idc]'); if(!b) return;
    const a=b.getAttribute('data-idc');
    if(a==='close'){ close(); return; }
    if(a==='take-front')  return openCamera('idfront');
    if(a==='take-back')   return openCamera('idback');
    if(a==='take-selfie') return openCamera('selfie');
    if(a==='shoot')       return shoot();
    if(a==='cam-cancel'){ const r=camReturn; stopCam(); return go(r); }
    if(a==='to-front')  return go('A');
    if(a==='to-back')   return go('Bk');
    if(a==='to-selfie') return go('B');
    if(a==='retake-front'){ clearShot('front'); clearShot('selfie'); return go('A'); } // ID change ⇒ new selfie
    if(a==='retake-back'){  clearShot('back');  return go('Bk'); }
    if(a==='retake-selfie'){clearShot('selfie');return go('B'); }
    if(a==='submit'){
      if(!idCaptureComplete()) return;          // hard gate — all THREE
      state.idSubmittedAt=Date.now();
      if(isTS){ state.trustShield=true; state.savedOnFile=true; }
      else { state.savedOnFile=false; }
      if(typeof onDone==='function'){ try{ onDone(); }catch(_){ } }
      go('Done');
    }
  });
  back.addEventListener('click',close);

  function close(){
    stopCam();
    sheet.classList.remove('show'); back.classList.remove('show');
    render();                                   // banner reflects the new state
  }
  window.__openIdCapture=async function(opts){
    opts=opts||{};
    isTS=!!opts.trustShield; onDone=typeof opts.onDone==='function'?opts.onDone:null;
    stopCam();
    /* Fresh session every time — the ID and selfie are always recaptured, so a stale
       pair can never be resubmitted as if it were taken now. */
    clearShot('front'); clearShot('back'); clearShot('selfie');
    errs={front:'',back:'',selfie:''};
    go('Checking');
    back.classList.add('show'); requestAnimationFrame(()=>sheet.classList.add('show'));
    const ok=await cameraExists();
    go(ok?'A':'NoCam');
  };
})();

// redeemed merchant Deal (lands prefilled on the canonical Review, Step 6).
(function(){
  const q=new URLSearchParams(location.search);
  const cat=q.get('category');
  if(q.get('demo')==='1'){ state.demo=true; state.step=1; state.maxStepReached=1; render(); return; }
  // "?step=1" — land on the real Step 1 category picker (Home's "All services").
  // Distinct from ?demo=1, which also flips state.demo and adds the "no account needed"
  // ribbon + demo-signup CTA — wrong for a signed-in requester browsing services.
  if(q.get('step')==='1'){ state.step=1; state.maxStepReached=1; render(); return; }
  if(cat && CATEGORIES[cat]) state.category=cat;
  if(q.get('from')==='deal'){
    state.category = (cat && CATEGORIES[cat]) ? cat : 'delivery';
    if(q.get('age')==='1'){ state.ageRestricted=true; markIdVerified(false); } // identity already resolved in Deals (D-029)
    if(q.get('ts')==='1'){ state.trustShield=true; markIdVerified(true); }
    if(q.get('items')==='1'){ state.itemsPurchased=true; }
    const cost=q.get('cost'); if(cost && parseFloat(cost)>0) state.costOfItems='$'+(parseFloat(cost)||0);
    const pay=q.get('pay'); if(pay && parseFloat(pay)>0) state.payAmount='$'+(parseFloat(pay)||0);
    state.dealMerchant=q.get('merchant')||'';
    state.fromDeal=true;   // marks this as a Gopher Deal request → the Go card shows the "Gopher Deal" badge
    /* kind: 'service' (a Service-Provider deal, set price) or 'merchant'. boost: the
       10% Deal Boost. Web sets these in __startDealRequest from the deal payload; this
       surface receives them on the query string. Defaulting kind to 'merchant' rather
       than null is deliberate — an unlabelled deal must NOT fall into the zero-fee
       service branch, which would waive every fee on an ordinary merchant deal. */
    state.dealKind = (q.get('kind')==='service') ? 'service' : 'merchant';
    state.dealBoost = q.get('boost')==='1' || state.dealKind==='service';
    state.step=6; state.maxStepReached=6;
    render(); return;
  }
  // "?from=again" — re-request a past job from Home's request history.
  // now=1  → "Request again NOW": nothing to review, land on the confirmation.
  // otherwise → "Request again w/ edits": land on the canonical Review (Step 6).
  // The past job's worker rides along in hireAgainGophers and gets first dibs.
  if(q.get('from')==='again'){
    const d=q.get('desc');   if(d) state.description=d;
    const w=q.get('worker'); if(w) state.hireAgainGophers=[w];
    state.waiverChecked=true;
    const land=q.get('now')==='1' ? 7 : 6;
    state.step=land; state.maxStepReached=land;
    render(); return;
  }
  state.step=2; state.maxStepReached=2;
  render();
})();

/* ── Cross-device draft sync (prototype) ─────────────────────────────────────
   Mirrors the wiring in Final/gopher-request.html so the app and the web agree on
   what a draft is. All judgement lives in the shared kernel
   (Final/assets/js/gopher-request-draft.js): what travels, what never does (ID
   captures and photo bytes never leave the device), what is re-derived on arrival.
   This block is only the wiring.

   ⛔ REMOTE SYNC IS OFF, AND THE COPY MUST KEEP SAYING "this device only".
   The requester surfaces have NO sign-in — 0 apiCall / sign_in / otp on both this
   file and the web page — and GET /api/v1/requests/draft scopes off the token's own
   user id, so there is nothing to scope to. Cross-device is gated on a
   requester-identity product decision, not on this code. Defining
   window.GOPHER_API_BASE + window.__gopherAuthToken() turns the server tier on with
   no other change here. Until then the wording stays local: the June copy fixes on
   gopher-request.html exist because it once claimed "your information is saved
   automatically" while nothing persisted. Do not let a dev token hook change it. */
(function initDraftSync(){
  var K = window.GopherRequestDraft, S = window.GopherRequestDraftStore;
  if(!K || !S) return;                 // modules absent -> flow behaves exactly as before

  /* Lazy, never at init: someone who merely opens this page and starts nothing is
     never given a persistent identifier. The store accepts a function and calls it
     only when it is about to persist. */
  var deviceId = null;
  function getDeviceId(){
    if(deviceId) return deviceId;
    try{
      deviceId = localStorage.getItem('gopher.request.deviceId');
      if(!deviceId){
        deviceId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
                                                        : 'proto-' + Math.random().toString(36).slice(2);
        localStorage.setItem('gopher.request.deviceId', deviceId);
      }
    }catch(_e){}
    return deviceId;
  }

  var apiBase = window.GOPHER_API_BASE || null;
  var tokenFn = typeof window.__gopherAuthToken === 'function' ? window.__gopherAuthToken : null;
  var crossDevice = !!(apiBase && tokenFn && tokenFn());

  var adapter = S.webLocalAdapter({ key: 'gopher.request.draft.proto' });
  if(crossDevice){
    adapter = S.tieredAdapter(adapter, S.remoteAdapter({
      baseUrl: apiBase,
      getHeaders: function(){ return { 'access-token': tokenFn() }; }
    }));
  }

  var store = S.createStore({
    adapter: adapter, origin: 'app-prototype', clientId: getDeviceId,
    onConflict: function(){ /* local wins until identity exists; nothing to reconcile */ }
  });

  /* ⛔ ARMING — the single most important line here, and this file makes it harder
     than the web page does. render() is called SYNCHRONOUSLY at the end of the entry
     IIFE, and there are FIVE such paths (?demo=1, ?step=1, ?from=deal, ?from=again,
     and the default), each of which may mutate state first — the deals deep-link sets
     category, cost and identity before rendering. All five run long before load()
     resolves. Unarmed, the first autosave would overwrite the very draft we are about
     to offer and a discard would delete it. Nothing is written or cleared until the
     resume question has been answered. */
  var armed = false;

  var _render = render;
  render = function(){
    _render.apply(this, arguments);
    if(armed) store.touch(state);
  };

  window.addEventListener('pagehide', function(){ if(armed) store.flush(state); });
  document.addEventListener('visibilitychange', function(){
    if(document.hidden && armed) store.flush(state);
  });

  /* ── The offer ────────────────────────────────────────────────────────────
     ⛔ COPY IS DELIBERATELY LOCAL-ONLY: "saved on this device". That is TRUE
     today and stays true until a real token exists. It must not become "saved
     across your devices" when the remote tier is switched on unless the token is
     genuinely there -- gopher-request.html once claimed "your information is
     saved automatically" while nothing persisted, and that is why this rule
     exists. The wording is derived from the adapter, not hardcoded optimism. */
  function summaryLine(sum){
    if(sum && sum.description) return String(sum.description).slice(0, 60);
    if(sum && sum.category) return String(sum.category);
    return 'Your request in progress';
  }
  /* Derived from the ADAPTER, never hardcoded: if the remote tier is off this must
     say "this device", because that is what is true. */
  function whereLine(){
    return crossDevice ? 'Saved to your account' : 'Saved on this device';
  }

  function dismissBanner(){
    var el = document.querySelector('.dr-resume');
    if(el && el.parentNode) el.parentNode.removeChild(el);   // remove, never [hidden]
  }

  /* ⛔ ARM ONLY ON AN ANSWER. The first version set armed=true when load() RESOLVED,
     which read as "we have finished asking" but means "we have finished LOADING" --
     the user had not answered anything yet. App Prototypes reproduced the
     consequence on the served build: banner up, user touches anything, autosave
     fires, and the saved request is overwritten by the new one. Silently, with the
     question still on screen a moment earlier. The comment claimed this could not
     happen while the code did it. Arm on Resume, on Start fresh, and immediately
     when there is nothing to protect -- never merely because bytes arrived. */
  /* ⚠️ IF YOU ARE DEBUGGING AND "NOTHING IS PERSISTING", CHECK FOR AN OPEN BANNER
     BEFORE ASSUMING THIS IS BROKEN. While an offer is pending, NO WRITE IS THE
     CORRECT STATE -- that is the whole point of arming on the answer. App
     Prototypes hit this on the verification re-run and nearly filed it as a
     regression; the absence of a write is now expected, which makes it very easy
     to misread as a defect. Two further probe traps from that same re-run, worth
     the two lines: the store's write is debounced, so a check at ~900ms can land
     just before it (dispatch `pagehide` to force a flush); and this band is
     painted with a background-IMAGE gradient, so `backgroundColor` reads
     rgba(0,0,0,0) even though it is plainly blue. */
  function armAfterAnswer(){ armed = true; }

  function offerResume(found){
    /* ⛔ MOUNTED AS A SIBLING OF #content, NOT INSIDE IT. render() does
       `content.innerHTML = bodyHTML` (:2303), which destroys anything within --
       so an unanswered offer vanished on the first re-render and took the user's
       chance to answer with it. #scroll is outside innerHTML's reach. Re-inserting
       after every render would also work and is strictly more code that can drift. */
    var scroll = document.querySelector('#scroll');
    var content = document.querySelector('#content');
    if(!scroll || !content) { armAfterAnswer(); return; }   // fail open: never trap a draft
    dismissBanner();

    var el = document.createElement('div');
    el.className = 'si-band dr-resume';
    var ico = document.createElement('span'); ico.className = 'si-ico'; ico.textContent = '\u21bb';
    var txt = document.createElement('div'); txt.className = 'si-text';
    var h = document.createElement('h5'); h.textContent = 'Pick up where you left off';
    var pEl = document.createElement('p'); pEl.textContent = summaryLine(found.summary);
    var where = document.createElement('div'); where.className = 'dr-where';
    where.textContent = whereLine();
    var acts = document.createElement('div'); acts.className = 'dr-acts';
    var yes = document.createElement('button'); yes.className = 'dr-primary';
    yes.type = 'button'; yes.textContent = 'Resume';
    var no = document.createElement('button'); no.type = 'button'; no.textContent = 'Start fresh';
    yes.addEventListener('click', function(){
      dismissBanner(); window.__protoDraftResume(found); armAfterAnswer();
    });
    no.addEventListener('click', function(){
      dismissBanner(); store.discard(); armAfterAnswer();
    });
    acts.appendChild(yes); acts.appendChild(no);
    txt.appendChild(h); txt.appendChild(pEl); txt.appendChild(where); txt.appendChild(acts);
    el.appendChild(ico); el.appendChild(txt);
    scroll.insertBefore(el, content);
  }

  store.load().then(function(found){
    var sum = (found && found.summary) || {};
    var worthOffering = !!(found && found.draft) && (sum.description || (sum.step && sum.step > 1));
    if(!worthOffering){ armAfterAnswer(); return; }   // nothing to protect -> arm now
    window.__protoDraftFound = found;                 // still inspectable for tests
    offerResume(found);                               // stays UNARMED until answered
  }).catch(function(){ armAfterAnswer(); });

  /* Dev-only, deliberately NOT wired to any button or copy. Lets a web->app
     cut-over be DEMONSTRATED without shipping a promise the build cannot keep. */
  window.__protoDraftResume = function(found){
    var f = found || window.__protoDraftFound;
    if(!f || !f.draft) return false;
    var r = store.resumeInto(f.draft, makeInitialState());
    /* ⚠️ Category FIRST, then the rest. realignCategoryState() wipes the 26 keys in
       CATEGORY_SCOPED_KEYS on a category change, so assigning category after the
       other fields would clear them out from under the restore. */
    if(r.state && r.state.category) state.category = r.state.category;
    if(typeof realignCategoryState === 'function') realignCategoryState();
    Object.keys(r.state || {}).forEach(function(k){ state[k] = r.state[k]; });
    render();
    return true;
  };
  window.__protoDraftDiscard = function(){ store.discard(); return true; };
})();

/* ====================================================================
   D-029 — Age-restricted quick-signup: resolve identity in the pop-up.
   Phone-first OTP + recognize-existing-Gopher (D-027/D-016). On the
   age-restricted branch, after recognize: TrustShield on file -> seal,
   no re-ask; otherwise -> standard ID-verify INLINE (no bounce-out).
   Reference behavior: Connect (__hasTrustShield / __trustShieldBannerBadge),
   seal art reused verbatim. Self-contained; appended to #phone.
   ==================================================================== */
(function(){
  // OPEN SUB-DECISION (founder) built as a config flip: completing inline
  // verification ENROLLS TrustShield (reusable, recommended) vs. one-off.
  const ENROLL_TRUSTSHIELD_ON_VERIFY = true;

  const SU_SEAL = `<img src="${TS_SEAL_URI}" alt="Gopher TrustShield">`; // canonical TrustShield mark (spliced)


  // ---- state (the resume stash makes backgrounding mid-verify resume, not restart) ----
  let S = freshState();
  function freshState(){ return { phase:'phone', ageRestricted:false, phone:'', otp:'',
    user:null, isNew:false, su:{first:'',last:'',email:'',dob:''},
    waiverOk:false, idCaptured:false, enroll:ENROLL_TRUSTSHIELD_ON_VERIFY, enrolled:false,
    hideDemo:false, identitySatisfied:false }; }

  // ---- build the sheet once ----
  const phone = document.getElementById('phone');
  const back = document.createElement('div'); back.className='su-back'; back.id='suBack';
  const sheet = document.createElement('div'); sheet.className='su-sheet'; sheet.id='suSheet';
  sheet.setAttribute('role','dialog'); sheet.setAttribute('aria-modal','true');
  sheet.innerHTML = '<div class="su-grip"></div><div class="su-body" id="suBody"></div>';
  phone.appendChild(back); phone.appendChild(sheet);
  const body = sheet.querySelector('#suBody');

  function open(ageRestricted, opts){ opts=opts||{}; S = freshState(); S.ageRestricted = !!ageRestricted; S.hideDemo=!!opts.hideDemo;
    if(opts.signedIn){ S.user = { first:'You', trustShield: !!opts.trustShield }; S.isNew=false; afterRecognize(); }
    render();
    back.classList.add('show'); requestAnimationFrame(()=>sheet.classList.add('show')); }
  function close(){ sheet.classList.remove('show'); back.classList.remove('show'); }

  // ---- renderers per phase ----
  function render(){ body.innerHTML = view(); afterRender(); }

  function view(){
    const u = S.user;
    switch(S.phase){

      case 'waiver': return `
        <span class="su-tag ar">Age-restricted order</span>
        <h3 class="su-title">Confirm your age${u?', '+u.first:''}</h3>
        <p class="su-sub">This order requires a 21+ check. ${u?'Welcome back — ':''}we just need a quick confirmation.</p>
        <div class="su-ar-banner">
          <span class="ar-mark">!</span>
          <div><div class="sf-label">Safe-Guarding &amp; Identity Verification Activated</div>
          <div class="sf-value">Physical ID required during exchange</div></div>
        </div>
        <label class="su-check"><input type="checkbox" id="suWaiver" ${S.waiverOk?'checked':''} data-su="waiverChk">
          <span>By continuing, you confirm you are at least 21 with a valid government-issued ID to present to the Gopher who delivers your order.</span></label>
        <button class="su-primary" data-su="waiverNext" ${S.waiverOk?'':'disabled'}>Continue →</button>`;

      case 'verify': return `
        <button class="su-link" data-su="back:waiver">← Back</button>
        <span class="su-tag ar">Identity verification</span>
        <h3 class="su-title">Verify your identity</h3>
        <p class="su-sub">Scan or upload a government-issued photo ID. This stays right here in signup — no detour.</p>
        <div class="su-idcap ${S.idCaptured?'done':''}" id="suIdcap">
          <div class="ic-frame">${S.idCaptured?ICO('check'):ICO('id')}</div>
          <div class="ic-cap">${S.idCaptured?'ID captured':'Front of your driver\u2019s license or state ID'}</div>
          <div class="ic-btns"><button class="ic-btn" data-su="capture">Scan ID</button><button class="ic-btn" data-su="capture">Upload</button></div>
          <div class="ic-okrow">${ICO('check')} Looks good</div>
        </div>
        ${ENROLL_TRUSTSHIELD_ON_VERIFY ? `<label class="su-check"><input type="checkbox" id="suEnroll" ${S.enroll?'checked':''} data-su="enrollChk">
          <span>Save to <b>TrustShield</b> so you won't have to submit ID next time (recommended).</span></label>` : ''}
        <button class="su-primary" data-su="verifyDone" ${S.idCaptured?'':'disabled'}>Verify &amp; continue →</button>
        <button class="su-link" data-su="bg" style="margin-top:6px;">⤓ Simulate leaving &amp; returning (resume test)</button>`;

      case 'sealed': {
        const newly = S.enrolled;
        return `
        <div class="su-seal">
          <div class="ar-ts-art">${SU_SEAL}</div>
          <div class="ar-ts-label">TrustShield<br>Verified</div>
        </div>
        <h3 class="su-title" style="text-align:center;margin-top:10px;">Identity verified</h3>
        <p class="su-sub" style="text-align:center;">TrustShield Verified — ID on file, no submission needed.${newly?' Saved for next time.':''}</p>
        <p class="su-fine" style="text-align:center;">A physical ID is still required in person at drop-off.</p>
        <button class="su-primary" data-su="done">${S.ageRestricted?'Continue to your order →':'Done →'}</button>`;
      }

      case 'done': return `
        <div class="su-done">
          <div class="dn-check">${ICO('check')}</div>
          <h3 class="su-title">You're all set${u?', '+u.first:''}!</h3>
          <p class="su-sub">${u?'Signed in to Gopher.':'Your Gopher account is ready.'}</p>
        </div>
        <button class="su-primary" data-su="done">Continue →</button>`;
    }
    return '';
  }

  function ICO(n){
    if(n==='check') return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L19 7"/></svg>';
    if(n==='id') return '<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="8" cy="12" r="2"/><path d="M13 10h5M13 13h5"/></svg>';
    return '';
  }

  function afterRender(){}

  // advance from the recognize step into the right branch
  function afterRecognize(){
    if(!S.ageRestricted){ S.phase='done'; return; }
    S.phase='waiver';
  }
  function afterWaiver(){
    const has = S.user && S.user.trustShield;        // __hasTrustShield() equivalent
    if(has){ S.phase='sealed'; S.identitySatisfied=true; } // seal, no re-ask
    else { S.phase='verify'; }                         // standard ID-verify inline
  }

  // ---- after each render: focus + wire dynamic inputs ----

  // ---- single delegated action handler for the sheet ----
  sheet.addEventListener('click',ev=>{
    const t=ev.target.closest('[data-su]'); if(!t) return;
    const a=t.dataset.su;
    if(a.startsWith('back:')){ S.phase=a.split(':')[1]; render(); return; }
    if(a==='waiverChk'){ S.waiverOk=!S.waiverOk; const b=body.querySelector('[data-su="waiverNext"]'); if(b) b.disabled=!S.waiverOk; return; }
    if(a==='enrollChk'){ S.enroll=!S.enroll; return; }
    if(a==='waiverNext'){ if(!S.waiverOk) return; afterWaiver(); render(); return; }
    if(a==='capture'){ S.idCaptured=true; render(); return; }
    if(a==='verifyDone'){ if(!S.idCaptured) return;
      if(S.enroll){ S.enrolled=true; if(S.user) S.user.trustShield=true; }
      S.identitySatisfied=true; S.phase='sealed'; render(); return; }
    if(a==='bg'){ simulateBackground(); return; }
    if(a==='done'){ if(window.__onSignupComplete) window.__onSignupComplete({signedIn:true,ageRestricted:S.ageRestricted,identitySatisfied:S.identitySatisfied,user:S.user}); close(); return; }
  });
  back.addEventListener('click',close);

  // ---- resume-on-background (app-specific): stash live state, restore on return ----
  let stash=null;
  function simulateBackground(){
    stash=JSON.parse(JSON.stringify(S));        // snapshot mid-verify
    body.innerHTML='<div class="su-done" style="padding:40px 0;"><p class="su-sub">App backgrounded… returning</p></div>';
    setTimeout(()=>{ if(stash){ S=stash; stash=null; render(); } },900);  // resume at same phase, inputs intact
  }
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden && sheet.classList.contains('show')) stash=JSON.parse(JSON.stringify(S));
    else if(!document.hidden && stash){ S=stash; stash=null; if(sheet.classList.contains('show')) render(); }
  });


  window.__openSignup = open;   // expose for tests / deep-link
})();

</script>
</body>
</html>
